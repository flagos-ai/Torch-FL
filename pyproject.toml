[build-system]
# torch is pinned to 2.10 to match the checked-in generated ATen bindings; the
# same pin is applied to install_requires via TORCH_PIN in setup.py, where the
# reasoning is spelled out.
requires = ["setuptools>=45", "wheel", "cmake>=3.18", "torch>=2.10,<2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "torch_fl"
# Version is computed in setup.py: the MetaX self-contained build appends a
# local segment (e.g. 0.1.0+metax3.8.1) via FLAGOS_WHEEL_LOCAL. A static value
# here would override setup()'s version, so it must be declared dynamic.
description = "FlagGems operators as a custom PyTorch device (flagos)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "FlagGems Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# flag_gems is the default operator source for the flagos device: its Triton
# kernels are routed via backends_*.conf and are on by default, so it is a hard
# runtime dependency (pure Python + Triton, installs cleanly from PyPI). It is
# NOT vendored into the wheel — flag_gems iterates fast and pinning a copy would
# only make upgrades harder. Versions match the validated 2.10 env.
#
# Declared dynamic so setup.py can drop flag_gems/triton on platforms built in
# pure-boxing mode (ACCELERATOR=dcu), where PyPI's NVIDIA-targeted triton wheel
# is the wrong artifact — DTK ships its own. See _install_requires() in setup.py.
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]
# FlagCX enables the heterogeneous unified-comm inner backend for distributed
# (ProcessGroupFlagOS tries it first, then falls back to the vendor-native
# backend — NCCL/HCCL). It is a hardware-specific compiled artifact (per-vendor
# adaptor + CCL) with no PyPI release, so it must be built from source:
# https://github.com/FlagOpen/FlagCX (see docs/architecture/distributed-flagcx.md).
# This extra is a marker only; installing it does not fetch a wheel.
flagcx = [
    "flagcx",
]

[project.entry-points."torch.backends"]
# PyTorch calls this at the end of `import torch`, so processes torch_fl does not
# start -- notably Inductor's parallel compile workers, which import torch and
# triton but never torch_fl -- still get the flagos device registered. Without it
# Triton's driver probe finds no active GPU backend in the worker and cold
# compiles fail. See torch_fl/_autoload.py.
torch_fl = "torch_fl._autoload:init"

[tool.setuptools.packages.find]
where = ["."]
include = ["torch_fl*", "accelerator*", "csrc.runtime.accelerator*"]

# Native libs (libtorch_fl.so) are built via setup.py cmdclass; editable install must
# run build_ext — see EditableWheelWithCmake in setup.py.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
