# flagos op backend config for thead (day-0 boxing only) -- AUTO-GENERATED.
# Regenerated by scripts/codegen/gen_vendor_confs.py -- do not edit manually.
#
# Full-coverage config: every op torch_fl can route is listed exactly
# once, so operator support for this platform is countable from this
# file alone.
#
# This is the DAY-0 BOXING-ONLY variant of backends_thead.conf:
# every op FlagGems does not cover here runs on the vendor's CUDA-ABI
# kernel instead of degrading to cpu_fallback. It exists so a new
# model can be brought up on day 0 without waiting for a FlagGems or
# vendor-native kernel per op, and it is TEMPORARY -- it is deleted
# once this platform's own operator routes cover day-0 models. Do not
# use it as the default conf and do not add a platform to it because
# boxing would be convenient there; see AGENTS.md.
#
# Select it with
#   FLAGOS_BACKEND_CONFIG=<install>/torch_fl/configs/backends_thead_boxing.conf
# and point the install at a boxing wheel (FLAGOS_BUILD_BOXING=1).
#
# Values:
#   flaggems_cpp  FlagGems C++ runtime (liboperators.so)
#   flaggems      FlagGems Python/Triton path
#   tileops       TileOPs Triton shims (needs FLAGOS_BUILD_TILEOPS=ON + SM90)
#   boxing        CUDA boxing kernel (this platform is CUDA-compatible)
#
# Routing priority: flaggems_cpp > flaggems > tileops > boxing.
# Boxing reuses the CUDA kernels for every op, so nothing routes to
# 'none' here.
#
# Coverage: 2037/2037 ops accelerated (100.0%)
#
# Note: 49 of the 482 FlagGems-covered ops are pinned to cuda; the other 433
# Note: route to flaggems. mm/bmm are the first four (FlagGems issue #6225:
# Note: PPU rejects the _hygon kernel's num_ldmatrixes kwarg) and 33 are the
# Note: 2026-09-15 overload survey's measured route-dependent failures. Four
# Note: more are reflection-padding routes that survey cannot reach: it derives
# Note: `padding` from the rank, so every profile fails ATen's arity check
# Note: before the device guard behind it can fire, and that guard is the
# Note: device-name mismatch the CUDA alignment fixes and leaves alone on every
# Note: other vendor. The last eight came from checks that survey cannot
# Note: see: the addmm family, whose autotune picks a BLOCK_SIZE_K < 16 config
# Note: on small-K shapes that the ppu triton rejects in tl.dot; _conj, which
# Note: FlagGems materializes instead of setting the Conjugate bit; _unsafe_view,
# Note: whose FlagGems reshape can silently return a copy; and slice.Tensor,
# Note: whose FlagGems route rejects complex dtypes. See
# Note: BOXING_TRITON_GAPS, which carries each op's failure, and
# Note: docs/reference/operator-support.md for the full survey.
#   flaggems        592
#   boxing         1445
#
# Override one op at runtime with FLAGOS_OP_<name>=<backend> (dots in
# the op name become double underscores: FLAGOS_OP_mm__out=flaggems).
# Collapse the whole table onto one backend family for A/B measurement
# with FLAGOS_FORCE_BACKEND=flaggems|vendor|tileops. An op only moves if
# that backend implements it -- known from the routed value plus its
# `# <backend>` annotation. The rest are reported on stderr and stay as
# configured, so FLAGOS_FORCE_BACKEND=vendor is partial by nature: a
# vendor implements far fewer ops than FlagGems.

