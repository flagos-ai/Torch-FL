# Format: op_name = backend
# backend: flaggems | flagos_python | tsingmicro | none
#
# The FlagGems and metadata-view registration fragments are derived from
# this sparse config. Unclaimed operators use the shared PrivateUse1 fallback.
#
# Override: FLAGOS_BACKEND_CONFIG=/path/to/backends.conf

