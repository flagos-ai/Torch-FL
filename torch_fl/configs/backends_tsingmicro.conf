acos = flagos_python
div.Scalar = flaggems
# Ops the Qwen-Image-2.1 path sent to cpu_fallback on the TX8110 build (census
# of 2026-10-19: isneginf/all ~33 per denoise step, tanh/index_select/tril/
# zero_ per step, plus the text-encode and VAE phases). Each was then measured
# against CPU by calling the exact `flag_gems.*` function its generated wrapper
# invokes -- the survey's torch-level path would silently cpu_fallback for an
# op the build does not claim yet (2026-10-21, fp32 and bf16, 32x32 and 4D,
# max|d| = 0 in every case).
#
# Two more the Qwen-Image-2.1 math-SDPA path sent to cpu_fallback, found with
# overload-level fallback logging (2026-10-21):
#   * native_batch_norm -- `nn.LayerNorm(elementwise_affine=False)` decomposes to
#     it on PrivateUse1, twice per transformer block (~67 per step). The internal
#     FlagGems build did not export `flag_gems.native_batch_norm`; the official
#     5.4.0 does, so the generated wrapper resolves.
#   * where.self_out -- the math SDPA applies its -inf masking through the out
#     variant (~35 per step); `where.self` alone does not cover it.
# `add.out` has no `flag_gems.add_out`, and `where.Scalar*` / `add.Scalar` are
# absent from the generated op set / kFlagGems dispatcher respectively, so they
# stay on cpu_fallback.
all.dim = flaggems
clamp_min = flaggems
div.Tensor = flaggems
gelu = flaggems
gt.Scalar = flaggems
gt.Tensor = flaggems
index_select = flaggems
isneginf = flaggems
native_batch_norm = flaggems
nonzero = flaggems
tanh = flaggems
tril = flaggems
where.self_out = flaggems
zero_ = flaggems
# Metadata-only view ops. TsingMicro has no accelerator kernel for any of
# these -- its non-FlagGems implementations are the CUDA boxing kernels, which
# need a vendor CUDA runtime the TX8110 wheel does not link (FLAGOS_BUILD_BOXING
# is off). Left unlisted they fall through the `flaggems` default to
# Dispatcher::GetFn, whose FlagGems slot is empty, and degrade to cuda_fn_ --
# dying in torch/cuda with
#
#   NotImplementedError: Could not run 'aten::as_strided' with arguments from
#   the 'CUDA' backend
#
# which is what every `mask[:, 0] = 1` in the model tests reduces to. They are
# pure stride arithmetic (at::native::* metadata helpers, no device kernel), so
# routing them to the tsingmicro slot is free and keeps the tensor on flagos.
alias = tsingmicro
detach = tsingmicro
permute = tsingmicro
select.int = tsingmicro
slice.Tensor = tsingmicro
squeeze = tsingmicro
squeeze.dim = tsingmicro
t = tsingmicro
transpose.int = tsingmicro
unbind.int = tsingmicro
unsqueeze = tsingmicro
_conj = tsingmicro
_neg_view = tsingmicro
_unsafe_view = tsingmicro
