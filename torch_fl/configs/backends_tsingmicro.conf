# flagos op backend config for TsingMicro
# Format: op_name = backend
# backend: flaggems | flagos_python
# Default (unlisted ops): flaggems
#
# Note: tsingmicro registers the *full* generated op list on PrivateUse1 (it
# takes the `#else` branch in csrc/aten/register.cc), so an op claimed there
# with no kernel behind it reaches the dispatcher and raises instead of boxing
# to cpu_fallback. An entry of `none` would therefore be a guaranteed raise,
# which is why this conf carries no `none` entry (asserted by
# tests/unit/test_gen_vendor_confs.py) and stays hand-written and sparse
# instead of being generated full-coverage.
#
# Override: FLAGOS_BACKEND_CONFIG=/path/to/backends.conf

mm = flaggems
mm.out = flaggems
bmm = flaggems
bmm.out = flaggems
cat = flaggems
embedding = flaggems
add.Tensor = flaggems
mul.Tensor = flaggems
silu = flaggems
rsqrt = flaggems
mean.dim = flaggems
cos = flaggems
sin = flaggems
neg = flaggems
pow.Tensor_Scalar = flaggems
all = flaggems
_softmax = flaggems
bitwise_and.Tensor = flaggems
le.Tensor = flaggems
where.self = flaggems
index.Tensor = flaggems
new_ones = flaggems
scalar_tensor = flaggems
ones_like = flaggems
zeros = flaggems
silu_backward = flaggems
sum.dim_IntList = flaggems
slice_backward = flaggems
constant_pad_nd = flaggems
embedding_dense_backward = flaggems
nll_loss_forward = flaggems
nll_loss_backward = flaggems
argmax = flaggems
argmin = flaggems
fill_.Scalar = flaggems
arange = flaggems
arange.start_step = flaggems
sub.Tensor = flaggems
eq.Tensor = flaggems
eq.Scalar = flaggems
max = flaggems
bitwise_not = flaggems
bitwise_or.Tensor = flaggems
any = flaggems
any.dim = flaggems
isin.Tensor_Tensor = flaggems
masked_fill_.Scalar = flaggems
lt.Tensor = flaggems
lt.Scalar = flaggems
cumsum = flaggems
