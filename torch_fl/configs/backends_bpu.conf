# flagos op backend config for D-Robotics RDK BPU
# Format: op_name = backend
# Override: FLAGOS_BACKEND_CONFIG=/path/to/backends.conf
#
# Intentionally empty. The table this file fills is consulted by
# GetBackendForOp() only from kernels registered on PrivateUse1, and BPU
# registers none: the BPU's unit of execution is a whole compiled graph (a .hbm
# produced by hbdk4), not an individual operator, so there is nothing to
# dispatch per call. Every aten op reaches cpu_fallback and acceleration comes
# from the torch.compile backend instead:
#
#     import torch, torch_fl
#     compiled = torch.compile(model, backend="bpu")
#
# The file exists so csrc/aten/common.cc's platform lookup
# (backends_bpu.conf) resolves rather than falling through to
# backends.conf, which would log a misleading CUDA-oriented table.
