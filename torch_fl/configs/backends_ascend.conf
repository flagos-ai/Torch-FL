random_.from = ascend
normal.float_float = ascend
normal.Tensor_float = ascend
normal.Tensor_Tensor = ascend
bernoulli = ascend
bernoulli_.float = ascend
bernoulli_.Tensor = ascend
randperm = ascend
randperm.out = ascend
rand_like = ascend
rand_like.generator = ascend
randn_like = ascend
randn_like.generator = ascend
randint_like = ascend
randint_like.low_dtype = ascend

# .out / .names_out variants delegate to the in-place helpers
rand.out = ascend
rand.names_out = ascend
randn.names_out = ascend
rand_like.out = ascend
randn_like.out = ascend
randint.low_out = ascend
randint.out = ascend
randint_like.out = ascend
randint_like.low_dtype_out = ascend

# Uniform-derived distributions: no aclnn kernel, composed from
# aclnnInplaceUniform + arithmetic (inverse-transform sampling)
exponential_ = ascend
log_normal_ = ascend
cauchy_ = ascend
geometric_ = ascend

native_dropout = ascend

# Rejection-sampled: no aclnn kernel, CPU round-trip (see rng.cc)
poisson = ascend
_standard_gamma = ascend
_sample_dirichlet = ascend
binomial = ascend
masked_select = ascend
# fused RMSNorm via aclnnRmsNorm (intercepts aten::_fused_rms_norm; HF must call
# F.rms_norm to route here). Collapses HF's ~6 ops + 2 casts per layer.
_fused_rms_norm = ascend
# ...and its backward via aclnnRmsNormGrad, without which nn.RMSNorm can be
# evaluated but not trained.
_fused_rms_norm_backward = ascend

