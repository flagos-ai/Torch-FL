split_with_sizes = ascend
split_with_sizes_copy.out = ascend
squeeze = ascend
squeeze.dim = ascend
unsqueeze = ascend
_unsafe_view = ascend
detach = ascend
t = ascend
unbind.int = ascend
alias = ascend
# Lazy math-bit views (Conjugate / Negative). Metadata-only aliases like alias,
# but a view op cannot fall back to CPU, so they need an explicit route or every
# copy/clone/contiguous of a conj/neg tensor raises "backend not registered".
_conj = ascend
_neg_view = ascend
topk = ascend
sort = ascend
sort.stable = ascend
scatter.src = ascend
multinomial = ascend
randn = ascend
randn.generator = ascend
rand = ascend
rand.generator = ascend
randint = ascend
randint.generator = ascend
