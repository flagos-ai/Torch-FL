# flagos op backend config for Ascend
# Format: op_name = backend
# backend: flaggems | ascend
# Default (unlisted ops): flaggems (will CPU-fallback if FlagGems is disabled)
#
# Usage: FLAGOS_BACKEND_CONFIG=torch_fl/backends_ascend.conf
#
# Only ops with a registered Ascend kernel (csrc/aten/backends/ascend/) can use "ascend".
# Others will use the default (flaggems) or CPU fallback.

mm = ascend
mm.out = ascend
bmm = ascend
bmm.out = ascend
matmul = ascend
cat = ascend
add.Tensor = ascend
mul.Tensor = ascend
silu = ascend
rsqrt = ascend
mean.dim = ascend
cos = ascend
sin = ascend
neg = ascend
pow.Tensor_Scalar = ascend
all = ascend
_softmax = ascend
bitwise_and.Tensor = ascend
le.Tensor = ascend
where.self = ascend
index.Tensor = ascend
new_ones = ascend
scalar_tensor = ascend
ones_like = ascend
zeros = ascend
silu_backward = ascend
sum.dim_IntList = ascend
slice_backward = ascend
nll_loss_forward = ascend
nll_loss_backward = ascend
# bespoke handwritten kernels (csrc/aten/backends/ascend/): generation path
_foreach_copy_ = ascend
lift_fresh = ascend
arange = ascend
arange.start = ascend
arange.start_step = ascend
argmax = ascend
isin.Tensor_Tensor = ascend
abs = ascend
acos = ascend

# FSDP2 gradient packing.
_chunk_cat = ascend
_chunk_cat.out = ascend

# SDPA (flash attention) + view ops (pure stride/metadata, no device compute)
_scaled_dot_product_efficient_attention = ascend
_scaled_dot_product_efficient_attention_backward = ascend
transpose.int = ascend
permute = ascend
select.int = ascend
slice.Tensor = ascend
# View-only ops built from narrow/slice (see backends/ascend/split.cc).
# Required by FSDP2's fully_shard.
