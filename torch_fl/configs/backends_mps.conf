# flagos op backend config for Apple Silicon (M-series) via Metal
# Format: op_name = backend
# Override: FLAGOS_BACKEND_CONFIG=/path/to/backends.conf
#
# Intentionally empty. The table this file fills is consulted by
# GetBackendForOp() only from kernels registered on PrivateUse1, and the MPS
# backend registers none yet: the runtime floor (allocate, copy, synchronize) is
# in place, and the operator layer that will claim ops -- an MPSGraph-first
# wrapper set under csrc/aten/backends/mps/, per
# docs/superpowers/specs/2026-10-14-apple-mps-native-backend-design.md section 6
# -- has not landed. Until it does, every aten op reaches cpu_fallback.
#
# The file exists so csrc/aten/common.cc's platform lookup
# (backends_mps.conf) resolves rather than falling through to backends.conf,
# which would log a misleading CUDA-oriented table.
