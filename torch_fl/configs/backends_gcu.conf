# flagos op backend config for Enflame GCU
# Format: op_name = backend
# backend: gcu | flaggems | flagos_python
# Default (unlisted ops): flaggems
#
# Only ops with a topsaten kernel are registered on PrivateUse1 (the m.impl
# list in csrc/aten/backends/gcu/generated/gcu_register.inc); every other op is
# left unregistered and reaches the CPU fallback. The generated block below is
# rewritten in place by scripts/codegen_gcu.py, so keep hand edits above it.
#
# Override: FLAGOS_BACKEND_CONFIG=/path/to/backends.conf

# Native topsaten RNG coverage for Enflame S60. Generator-less routes consume
# the shared seed/offset stream used by FlagGems; explicit generators remain
# isolated. Unsupported dtypes still use the CPU fallback.
bernoulli = gcu
bernoulli_.float = gcu
exponential = gcu
exponential_ = gcu
multinomial = gcu
poisson = gcu
randn.generator = gcu
randn_like.generator = gcu
randn_like.generator_out = gcu
randint.generator = gcu
randint.low_generator = gcu
randperm.generator = gcu
random_ = gcu
random_.to = gcu

