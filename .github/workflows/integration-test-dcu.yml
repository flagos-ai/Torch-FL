name: Integration Tests (DCU)

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 60
  workflow_dispatch:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 60

jobs:
  # The test list lives in .github/configs/dcu.yml, not inline here. See
  # load-platform-tests.yml for why.
  load-tests:
    uses: ./.github/workflows/load-platform-tests.yml
    with:
      platform: dcu

  integration-tests:
    name: Build and test (DCU)
    needs: load-tests
    runs-on:
      - hg-8g-cicd-pytorch
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    container:
      image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260816-dcu-ci
      volumes:
        - /usr/local/hyhal:/usr/local/hyhal:ro
      options: >-
        --privileged
        --ipc=host
        --shm-size=512g
        --ulimit memlock=-1
        --cap-add=SYS_PTRACE
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Self-hosted runners accumulate stale wheels in ~/.cache/pip across
      # runs (pip no longer passes --no-cache-dir); wipe before restore so
      # the uploaded archive stays bounded to this run's downloads.
      - name: Reset pip cache dir
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/pip-cache"

      # Cache pip downloads across runs. The cache only skips the download,
      # not the install, so the environment prepared by set_env_dcu.sh is
      # still rebuilt fresh each run. PIP_CACHE_DIR is persisted to
      # $GITHUB_ENV by the setup script and points at RUNNER_TEMP, which the
      # container owns; /github/home is not writable by the runtime user on
      # this image, so without that redirect pip disables its cache there.
      #
      # set_env_dcu.sh is hashed because the real version pins live there;
      # without it a pin bump leaves the key unchanged, the exact-hit skips the
      # save, and the newly downloaded wheels are discarded every run.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pip-cache
          key: dcu-pip-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'setup.py', '.github/scripts/set_env_dcu.sh') }}
          restore-keys: |
            dcu-pip-${{ runner.os }}-

      - name: Prepare DCU build environment
        env:
          CI_STAGE: integration
        run: bash .github/scripts/set_env_dcu.sh

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Prepare wheel-only test workspace
        run: |
          TEST_ROOT=$(mktemp -d "${RUNNER_TEMP:-/tmp}/torch-fl-dcu.XXXXXX")
          # The runner executes each configured command with this directory as
          # its cwd, so what it holds is what those commands can reach. Keep it
          # wheel-only: `Run unit tests (per file)` is a source-tree suite and
          # changes back to the checkout itself, and every group that stays here
          # runs against the installed wheel rather than the checkout it was
          # built from. tests/unit/test_integration_workdir.py holds both ends of
          # that arrangement.
          cp -a tests pyproject.toml "$TEST_ROOT/"
          printf 'INTEGRATION_WORKDIR=%s\n' "$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Run DCU integration tests
        env:
          INTEGRATION_TESTS: ${{ needs.load-tests.outputs.integration_tests }}
          INTEGRATION_ENVIRONMENT: ${{ needs.load-tests.outputs.integration_environment }}
        run: python .github/scripts/run_integration_tests.py
