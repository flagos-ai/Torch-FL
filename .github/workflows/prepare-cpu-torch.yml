name: Prepare published CPU Torch

on:
  workflow_call:
    inputs:
      checkout_repository:
        type: string
        default: ''
      checkout_ref:
        type: string
        default: ''
    outputs:
      artifact_name:
        value: ${{ jobs.prepare.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prefetch original Ascend CPU Torch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.download.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and verify the pinned wheel cohort
        id: download
        run: |
          set -euo pipefail
          source .github/version-pins.env
          directory="$RUNNER_TEMP/cpu-torch-wheelhouse"
          python .github/scripts/prepare_cpu_torch.py download \
            --directory "$directory" \
            --version "$CPU_TORCH_VERSION_DEFAULT" \
            --python-version "$FLAGTREE_PYTHON_VERSION_ascend" \
            --index-url "$CPU_TORCH_INDEX_URL_DEFAULT" \
            --torch-wheel "$CPU_TORCH_WHEEL_ascend" \
            --sha256 "$CPU_TORCH_WHEEL_SHA256_ascend"
          suffix="$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          printf 'artifact_name=cpu-torch-ascend-%s\n' "$suffix" >> "$GITHUB_OUTPUT"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.download.outputs.artifact_name }}
          path: ${{ steps.download.outputs.directory }}
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
