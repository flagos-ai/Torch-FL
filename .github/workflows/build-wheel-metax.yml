name: Build Wheel (MetaX)

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: "Whether to upload the built wheel as an artifact"
        required: false
        type: boolean
        default: true
      publish:
        description: "Whether to publish the built wheel to its vendor Nexus lane"
        required: false
        type: boolean
        default: false
    secrets:
      NEXUS_TOKEN:
        description: "user:token for the vendor Nexus lanes, read only when publish is set"
        required: false
  workflow_dispatch:
    inputs:
      upload-artifact:
        description: "Whether to upload the built wheel as an artifact"
        required: false
        type: boolean
        default: true

jobs:
  build:
    uses: ./.github/workflows/all-tests-common.yml
    with:
      platform: metax
      run_build: true
      run_integration_tests: false
      upload_artifact: ${{ inputs['upload-artifact'] }}
      publish: ${{ inputs.publish }}
    secrets:
      NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
