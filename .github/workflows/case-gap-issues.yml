# A skipped shared case is allowed only while its Torch-FL and upstream issues
# are open. The trusted base owns the query and source check. The submitted
# checkout supplies data only and is never imported or executed.

name: Case gap issues

permissions:
  contents: read
  issues: read

on:
  workflow_call:
    inputs:
      checkout_repository:
        required: true
        type: string
      checkout_ref:
        required: true
        type: string
      registry_repository:
        required: true
        type: string
      registry_ref:
        required: true
        type: string
    secrets:
      GH_TOKEN:
        required: true
  workflow_dispatch:

jobs:
  verify-gate:
    name: Verify case gap issues
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out submitted case-gap data
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.registry_repository || inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.registry_ref || inputs.checkout_ref || github.sha }}
          path: registry
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            .github/scripts/ci/check_case_gap_issues.py
            tests/integration/case_gap_issues.py
            tests/integration/ops/test_all_dispatch.py
            tests/integration/ops/test_mps_all.py
            tests/integration/ops/test_mps_argmax.py
            tests/unit/test_integration_source_contract.py
          sparse-checkout-cone-mode: false

      # This commit is the first tree containing the shared source contract.
      # On the first pull request run the base cannot yet resolve this reusable
      # workflow, so its checkout is the controller pinned for that commit. The
      # later revision checks out the actual base revision. Only the registry
      # and tests below are read, and their paths are passed to the AST parser.
      - name: Check out trusted issue query
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci/check_case_gap_issues.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require every registered case gap to have open issues
        working-directory: trusted
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python .github/scripts/ci/check_case_gap_issues.py \
            --script-root "$GITHUB_WORKSPACE/trusted/.github/scripts/ci" \
            --registry "$GITHUB_WORKSPACE/registry/tests/integration/case_gap_issues.py" \
            --source-contract "$GITHUB_WORKSPACE/registry/tests/unit/test_integration_source_contract.py"
