name: CI

on:
  push:
    branches: ["2.9"]
    paths:
      - "cmake/**"
      - "csrc/**"
      - "include/**"
      - "scripts/**"
      - "tests/**"
      - "torch_fl/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "setup.py"
      - ".github/configs/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["2.9"]
    paths:
      - "cmake/**"
      - "csrc/**"
      - "include/**"
      - "scripts/**"
      - "tests/**"
      - "torch_fl/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "setup.py"
      - ".github/configs/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  discover-platforms:
    name: Discover platforms
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.detect.outputs.platforms }}
      common_platforms: ${{ steps.detect.outputs.common_platforms }}
      has_cuda: ${{ steps.detect.outputs.has_cuda }}
      has_ascend: ${{ steps.detect.outputs.has_ascend }}
      has_dcu: ${{ steps.detect.outputs.has_dcu }}
      has_metax: ${{ steps.detect.outputs.has_metax }}
      cuda_only: ${{ steps.policy.outputs.cuda_only }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect configured platforms
        id: detect
        run: |
          platforms=$(find .github/configs -maxdepth 1 -type f -name '*.yml' \
            -exec basename {} .yml \; | sort | jq -R -s -c 'split("\n")[:-1]')
          if [[ "$platforms" == "[]" ]]; then
            echo "::error::No platform configs found"
            exit 1
          fi
          common_platforms=$(jq -c 'map(select(. != "ascend" and . != "dcu" and . != "metax" and . != "cuda"))' <<<"$platforms")
          has_cuda=$(jq -r 'index("cuda") != null' <<<"$platforms")
          has_ascend=$(jq -r 'index("ascend") != null' <<<"$platforms")
          has_dcu=$(jq -r 'index("dcu") != null' <<<"$platforms")
          has_metax=$(jq -r 'index("metax") != null' <<<"$platforms")
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "common_platforms=$common_platforms" >> "$GITHUB_OUTPUT"
          echo "has_cuda=$has_cuda" >> "$GITHUB_OUTPUT"
          echo "has_ascend=$has_ascend" >> "$GITHUB_OUTPUT"
          echo "has_dcu=$has_dcu" >> "$GITHUB_OUTPUT"
          echo "has_metax=$has_metax" >> "$GITHUB_OUTPUT"

      - name: Resolve watch policy
        id: policy
        run: |
          # The 2.9 stable branch only guards the CUDA line.
          # Ascend/DCU/MetaX are exercised on their own development branches.
          ref="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          if [[ "$ref" == "2.9" ]]; then
            echo "cuda_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "cuda_only=false" >> "$GITHUB_OUTPUT"
          fi

  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: discover-platforms
    if: needs.discover-platforms.outputs.common_platforms != '[]' && needs.discover-platforms.outputs.cuda_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.discover-platforms.outputs.common_platforms) }}
    uses: ./.github/workflows/all-tests-common.yml
    with:
      platform: ${{ matrix.platform }}

  ascend-pipeline:
    name: Platform pipeline (ascend)
    needs: discover-platforms
    if: needs.discover-platforms.outputs.has_ascend == 'true' && needs.discover-platforms.outputs.cuda_only != 'true'
    uses: ./.github/workflows/integration-test-ascend.yml

  cuda-pipeline:
    name: Platform pipeline (cuda)
    needs: discover-platforms
    if: needs.discover-platforms.outputs.has_cuda == 'true'
    uses: ./.github/workflows/integration-test-cuda.yml

  dcu-pipeline:
    name: Platform pipeline (dcu)
    needs: discover-platforms
    if: needs.discover-platforms.outputs.has_dcu == 'true' && needs.discover-platforms.outputs.cuda_only != 'true'
    uses: ./.github/workflows/integration-test-dcu.yml

  metax-pipeline:
    name: Platform pipeline (metax)
    needs: discover-platforms
    if: needs.discover-platforms.outputs.has_metax == 'true' && needs.discover-platforms.outputs.cuda_only != 'true'
    uses: ./.github/workflows/integration-test-metax.yml
