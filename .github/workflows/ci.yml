name: CI

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 CST daily
  push:
    branches: [main, dev, devops, dev-hygon, dev-thead, dev-musa]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
  pull_request:
    branches: [main, dev, devops, dev-hygon]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  # Repository-wide checks that need no accelerator, no vendor image, and no
  # built wheel (generated-conf freshness, setup-script syntax, hardware-free
  # unit tests). Runs on ubuntu-latest in seconds; discover-platforms gates on
  # it so every hardware pipeline below fails fast instead of burning a
  # vendor job on a breakage no platform owns.
  agnostic-checks:
    name: Platform-agnostic checks
    needs: lint
    uses: ./.github/workflows/agnostic-checks.yml

  codegen-checks:
    name: Codegen checks
    needs: lint
    uses: ./.github/workflows/codegen-checks.yml

  discover-platforms:
    name: Discover platforms
    needs: [lint, agnostic-checks, codegen-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.detect.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Emits `platforms` as a JSON array of the config basenames under
      # .github/configs, narrowed to the platforms a pull request can affect.
      # The pipeline below is dispatched from it directly, so there is no second
      # list of platform names here to fall out of step with the configs.
      - name: Detect configured platforms
        id: detect
        run: |
          python .github/scripts/ci/generate_matrix.py \
            --event-name "${{ github.event_name }}" \
            --base-ref  "${{ github.base_ref || 'main' }}" \
            --configs-dir .github/configs \
            >> "$GITHUB_OUTPUT"

  # One hardware pipeline per platform, from the list discovery just emitted.
  # There were eight spelled-out jobs here before, each naming a workflow file
  # and, for Ascend and DCU, repeating a timeout that the config already carried:
  # the only thing that differed was the platform, and the list had to be edited
  # in three places to add one. The pipeline reads the platform's config now, so
  # the runner label, image, mounts, timeout and test manifest all come from
  # there, and `fail-fast: false` keeps a red platform from cancelling the eight
  # others -- which is what the independent jobs did before.
  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: discover-platforms
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.discover-platforms.outputs.platforms) }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      platform: ${{ matrix.platform }}
