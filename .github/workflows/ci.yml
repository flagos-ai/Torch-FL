name: CI

permissions:
  contents: read
  pull-requests: read
  actions: write

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 CST daily
  push:
    branches: [main, dev, devops, dev-hygon, dev-thead, dev-musa, iluvatar_build_and_test]
  pull_request:
    branches: [main, dev, devops, dev-hygon]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms to run, or all'
        required: false
        default: all
        type: string
      pr_number:
        description: 'PR number for a trusted fork on-demand run'
        required: false
        default: ''
        type: string

jobs:
  # Resolve the source repository and immutable commit before any reusable
  # workflow starts. Fork on-demand runs are dispatched from this workflow on
  # the base branch, so the workflow definition remains trusted while the jobs
  # test the PR head commit supplied by the API.
  resolve-checkout:
    name: Resolve checkout source
    # A newer PR head or push to the same branch supersedes source resolution.
    # Leaving automatic runs out of cancellation also keeps /ci independent.
    concurrency:
      group: ci-resolve-${{ github.event_name }}-${{ github.event.pull_request.number || format('dispatch-{0}', inputs.pr_number) || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.resolve.outputs.repository }}
      ref: ${{ steps.resolve.outputs.ref }}
      pull_request: ${{ steps.resolve.outputs.pull_request }}
      branch: ${{ steps.resolve.outputs.branch }}
    steps:
      - name: Resolve trusted source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          set -euo pipefail

          repository="$EVENT_REPOSITORY"
          ref="$EVENT_REF"
          pull_request=""
          branch="$EVENT_BRANCH"
          if [[ -n "$PR_NUMBER" ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::pr_number must be a positive integer"
              exit 1
            fi
            pr=$(gh api "repos/${EVENT_REPOSITORY}/pulls/${PR_NUMBER}")
            repository=$(jq -r '.head.repo.full_name // empty' <<<"$pr")
            ref=$(jq -r '.head.sha // empty' <<<"$pr")
            branch=$(jq -r '.head.ref // empty' <<<"$pr")
            state=$(jq -r '.state // empty' <<<"$pr")
            if [[ "$state" != "open" ]]; then
              echo "::error::PR #${PR_NUMBER} is not open"
              exit 1
            fi
            if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::PR head repository is unavailable (the fork may have been deleted)"
              exit 1
            fi
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::PR head SHA is not a full commit SHA"
              exit 1
            fi
            if [[ -z "$branch" || "$branch" == *$'\n'* ]]; then
              echo "::error::PR head branch is unavailable"
              exit 1
            fi
            pull_request="$PR_NUMBER"
            echo "Testing PR #${PR_NUMBER} from ${repository}@${ref}"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$EVENT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::pull request number is unavailable"
              exit 1
            fi
            pull_request="$EVENT_PR_NUMBER"
          fi

          printf 'repository=%s\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'pull_request=%s\n' "$pull_request" >> "$GITHUB_OUTPUT"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"

  # Lifecycle cleanup has a queue of its own. Sharing it with tests or the gate
  # would let cancelling an older run also remove the newer run's jobs.
  #
  # The job runs on every event, including the ones with nothing to supersede,
  # and decides that in its own step. A job-level `if` would be the obvious
  # spelling and is the wrong one: every job below `needs` this one, a skipped
  # dependency skips them in turn, and the gate reads a skip as a failure -- so
  # the nightly schedule and a platforms-only workflow_dispatch would run no
  # tests at all and report red.
  ci-lifecycle:
    name: Cancel superseded runs
    needs: resolve-checkout
    concurrency:
      group: ci-lifecycle-${{ github.event_name }}-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      SOURCE: ${{ needs.resolve-checkout.outputs.pull_request && 'pr' || 'push' }}
      PR_NUMBER: ${{ needs.resolve-checkout.outputs.pull_request }}
      BRANCH: ${{ needs.resolve-checkout.outputs.branch }}
      REVISION: ${{ needs.resolve-checkout.outputs.ref }}
      DISPATCH_PR: ${{ inputs.pr_number }}
    steps:
      - name: Check out the resolved revision
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-checkout.outputs.repository }}
          ref: ${{ needs.resolve-checkout.outputs.ref }}
          persist-credentials: false

      - name: Cancel active runs replaced by this revision
        # Selector arguments are passed as separate shell words so a branch
        # name cannot inject an option into the Python command.
        #
        # The nightly schedule and a platforms-only workflow_dispatch have
        # nothing to supersede: there is no newer head of the same PR and no
        # older push to the same branch. They are reported and skipped here
        # rather than through a job-level `if`, so the jobs that depend on this
        # one still run.
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" \
             && "$EVENT_NAME" != "push" \
             && -z "$DISPATCH_PR" ]]; then
            echo "$EVENT_NAME supersedes no earlier run; nothing to cancel."
            exit 0
          fi
          if [[ "$SOURCE" = "pr" ]]; then
            PYTHONPATH=.github/scripts/ci python3 \
              .github/scripts/ci/ci_concurrency.py \
              --repository "$GITHUB_REPOSITORY" \
              --revision "$REVISION" \
              --pull-request="$PR_NUMBER" \
              --current-run "$GITHUB_RUN_ID"
          elif [[ "$SOURCE" = "push" ]]; then
            PYTHONPATH=.github/scripts/ci python3 \
              .github/scripts/ci/ci_concurrency.py \
              --repository "$GITHUB_REPOSITORY" \
              --revision "$REVISION" \
              --branch="$BRANCH" \
              --current-run "$GITHUB_RUN_ID"
          else
            echo "::error::automatic cleanup requires a pull request or push"
            exit 1
          fi

  lint:
    needs: [resolve-checkout, ci-lifecycle]
    uses: ./.github/workflows/lint.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  # Repository-wide checks that need no accelerator, no vendor image, and no
  # built wheel. They run against the same immutable source as the hardware
  # matrix, so fork on-demand runs test the submitted PR rather than base main.
  agnostic-checks:
    name: Platform-agnostic checks
    needs: [resolve-checkout, ci-lifecycle, lint]
    concurrency:
      group: ci-agnostic-${{ github.event_name }}-${{ needs.resolve-checkout.outputs.pull_request || needs.resolve-checkout.outputs.branch }}
      cancel-in-progress: true
    uses: ./.github/workflows/agnostic-checks.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  codegen-checks:
    name: Codegen checks
    needs: [resolve-checkout, ci-lifecycle, lint]
    concurrency:
      group: ci-codegen-${{ github.event_name }}-${{ needs.resolve-checkout.outputs.pull_request || needs.resolve-checkout.outputs.branch }}
      cancel-in-progress: true
    uses: ./.github/workflows/codegen-checks.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  discover-platforms:
    name: Discover platforms
    needs: [resolve-checkout, ci-lifecycle, lint, agnostic-checks, codegen-checks]
    concurrency:
      group: ci-discover-${{ github.event_name }}-${{ needs.resolve-checkout.outputs.pull_request || needs.resolve-checkout.outputs.branch }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.detect.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-checkout.outputs.repository }}
          ref: ${{ needs.resolve-checkout.outputs.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install matrix parser dependency
        run: python -m pip install PyYAML

      # Emits `platforms` as a JSON array of config basenames, narrowed to the
      # platforms a pull request can affect. Labels take precedence over files.
      - name: Detect configured platforms
        id: detect
        env:
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH_PLATFORMS: ${{ inputs.platforms || '' }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PR_LABELS=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_LABELS=$(jq -r 'join(",")' <<<"$PR_LABELS_JSON")
          fi

          python .github/scripts/ci/generate_matrix.py \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --configs-dir .github/configs \
            --pr-labels "$PR_LABELS" \
            --dispatch-platforms "$DISPATCH_PLATFORMS" \
            >> "$GITHUB_OUTPUT"

  # One hardware pipeline per configured platform. The reusable workflow reads
  # runner, image, timeout, and test manifest values from that platform config.
  #
  # fail-fast is off on purpose. The PR is red whatever the other lanes do, so
  # cancelling them on the first failure saves accelerator time only when the
  # failure is the *only* one -- and that is exactly the case that is not true
  # here. A cancelling matrix reports the first red and nothing else: fix it,
  # push, wait a full round, and the next run reports the next. The cost is paid
  # on every lane that turned out to be fine anyway (a cancelled lane is not a
  # measurement), which is why the platform set stays as narrow as the diff
  # allows (paths_watch in .github/configs/<platform>.yml). Letting every
  # selected lane finish turns N rounds into one and still fails `CI complete`
  # for any lane that did not pass -- see tests/unit/test_ci_fail_fast.py.
  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: [resolve-checkout, ci-lifecycle, discover-platforms]
    concurrency:
      group: ci-platform-${{ github.event_name }}-${{ needs.resolve-checkout.outputs.pull_request || needs.resolve-checkout.outputs.branch }}-${{ matrix.platform }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.discover-platforms.outputs.platforms) }}
    uses: ./.github/workflows/integration-tests.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      platform: ${{ matrix.platform }}
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  # Single required-check gate for branch protection.
  ci-complete:
    name: CI complete
    if: always()
    needs:
      - resolve-checkout
      - ci-lifecycle
      - lint
      - agnostic-checks
      - codegen-checks
      - discover-platforms
      - platform-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Verify shared checks and selected platforms passed
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          jobs = json.loads(os.environ["RESULTS"])
          errors = []
          names = (
              "resolve-checkout",
              "ci-lifecycle",
              "lint",
              "agnostic-checks",
              "codegen-checks",
              "discover-platforms",
          )
          for name in names:
              if jobs[name]["result"] != "success":
                  errors.append(f"{name}: {jobs[name]['result']}")

          try:
              selected = json.loads(jobs["discover-platforms"]["outputs"]["platforms"])
              if not isinstance(selected, list) or not all(isinstance(p, str) for p in selected):
                  raise ValueError("platforms must be an array of strings")
          except (KeyError, TypeError, ValueError) as exc:
              errors.append(f"Invalid platform discovery: {exc}")
              selected = []

          platform_result = jobs["platform-pipeline"]["result"]
          if selected and platform_result != "success":
              errors.append(f"platform-pipeline: {platform_result}")
          elif not selected and platform_result not in ("success", "skipped"):
              errors.append(f"platform-pipeline: {platform_result}")

          # The matrix result says that some lane failed, not which one -- the
          # matrix collapses every failure into "failure", and a lane can still
          # be cancelled out from under it (a timeout, or the run being stopped
          # by hand). Read the run's jobs back and report each one's conclusion.
          # This is a nicety: wherever the API cannot answer (no token, no run id), the
          # gate still decides on the results above.
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          try:
              if not (run_id and repo and os.environ.get("GH_TOKEN")):
                  raise ValueError("not in a GitHub run with a token")
              listing = subprocess.run(
                  [
                      "gh", "api", "--paginate",
                      f"repos/{repo}/actions/runs/{run_id}/jobs",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              # --paginate joins the pages' objects; normalize either shape.
              pages = json.loads(listing if listing.lstrip().startswith("[") else f"[{listing}]")
              listed = [job for page in pages for job in page.get("jobs", [])]
          except (subprocess.CalledProcessError, ValueError, AttributeError) as exc:
              print(f"::warning::could not list job conclusions: {exc}")
              listed = []

          for job in listed:
              name = job.get("name", "")
              conclusion = job.get("conclusion")
              if conclusion in ("failure", "timed_out"):
                  print(f"::error::{name}: {conclusion}")
              elif conclusion == "cancelled" and name.startswith("Platform pipeline ("):
                  print(
                      f"::notice::{name} was cancelled before it finished, so it "
                      "measured nothing; re-run that lane to measure it"
                  )

          for error in errors:
              print(f"::error::{error}")
          if errors:
              sys.exit(1)
          print("Shared checks and all selected platforms passed.")
          PY
