name: CI

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 CST daily
  push:
    branches: [main, dev, devops, dev-hygon, dev-thead, dev-musa]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
  pull_request:
    branches: [main, dev, devops, dev-hygon]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  # Repository-wide checks that need no accelerator, no vendor image, and no
  # built wheel (generated-conf freshness, setup-script syntax, hardware-free
  # unit tests). Runs on ubuntu-latest in seconds; discover-platforms gates on
  # it so every hardware pipeline below fails fast instead of burning a
  # vendor job on a breakage no platform owns.
  agnostic-checks:
    name: Platform-agnostic checks
    needs: lint
    uses: ./.github/workflows/agnostic-checks.yml

  codegen-checks:
    name: Codegen checks
    needs: lint
    uses: ./.github/workflows/codegen-checks.yml

  discover-platforms:
    name: Discover platforms
    needs: [lint, agnostic-checks, codegen-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.detect.outputs.platforms }}
      common_platforms: ${{ steps.detect.outputs.common_platforms }}
      has_cuda: ${{ steps.detect.outputs.has_cuda }}
      has_ascend: ${{ steps.detect.outputs.has_ascend }}
      has_dcu: ${{ steps.detect.outputs.has_dcu }}
      has_metax: ${{ steps.detect.outputs.has_metax }}
      has_ppu: ${{ steps.detect.outputs.has_ppu }}
      has_musa: ${{ steps.detect.outputs.has_musa }}
      has_kunlunxin: ${{ steps.detect.outputs.has_kunlunxin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect configured platforms
        id: detect
        run: |
          # generate_matrix.py writes platforms=JSON to GITHUB_OUTPUT;
          # derive the per-platform flags and common_platforms from that list.
          python .github/scripts/ci/generate_matrix.py \
            --event-name "${{ github.event_name }}" \
            --base-ref  "${{ github.base_ref || 'main' }}" \
            --configs-dir .github/configs \
            >> "$GITHUB_OUTPUT"

          platforms=$(grep '^platforms=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)

          common_platforms=$(jq -c 'map(select(. != "ascend" and . != "dcu" and . != "metax" and . != "cuda" and . != "ppu" and . != "musa" and . != "kunlunxin"))' <<<"$platforms")
          has_cuda=$(jq -r 'index("cuda") != null' <<<"$platforms")
          has_ascend=$(jq -r 'index("ascend") != null' <<<"$platforms")
          has_dcu=$(jq -r 'index("dcu") != null' <<<"$platforms")
          has_metax=$(jq -r 'index("metax") != null' <<<"$platforms")
          has_ppu=$(jq -r 'index("ppu") != null' <<<"$platforms")
          has_musa=$(jq -r 'index("musa") != null' <<<"$platforms")
          has_kunlunxin=$(jq -r 'index("kunlunxin") != null' <<<"$platforms")
          echo "common_platforms=$common_platforms" >> "$GITHUB_OUTPUT"
          echo "has_cuda=$has_cuda" >> "$GITHUB_OUTPUT"
          echo "has_ascend=$has_ascend" >> "$GITHUB_OUTPUT"
          echo "has_dcu=$has_dcu" >> "$GITHUB_OUTPUT"
          echo "has_metax=$has_metax" >> "$GITHUB_OUTPUT"
          echo "has_ppu=$has_ppu" >> "$GITHUB_OUTPUT"
          echo "has_musa=$has_musa" >> "$GITHUB_OUTPUT"
          echo "has_kunlunxin=$has_kunlunxin" >> "$GITHUB_OUTPUT"

  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: discover-platforms
    if: needs.discover-platforms.outputs.common_platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.discover-platforms.outputs.common_platforms) }}
    uses: ./.github/workflows/all-tests-common.yml
    with:
      platform: ${{ matrix.platform }}

  ascend-pipeline:
    name: Platform pipeline (ascend)
    needs: discover-platforms
    if: needs.discover-platforms.outputs.has_ascend == 'true'
    uses: ./.github/workflows/integration-test-ascend.yml
    with:
      timeout-minutes: 120

  cuda-pipeline:
    name: Platform pipeline (cuda)
    needs: discover-platforms
    if: needs.discover-platforms.outputs.has_cuda == 'true'
    uses: ./.github/workflows/integration-test-cuda.yml

  dcu-pipeline:
    name: Platform pipeline (dcu)
    needs: discover-platforms
    if: needs.discover-platforms.outputs.has_dcu == 'true'
    uses: ./.github/workflows/integration-test-dcu.yml
    with:
      # Matches timeout_minutes in .github/configs/dcu.yml, which this pipeline
      # does not read: the dedicated pipelines take their timeout from the
      # workflow input, and the reusable workflow's own default is 60.
      timeout-minutes: 90

  metax-pipeline:
    name: Platform pipeline (metax)
    needs: discover-platforms
    if: needs.discover-platforms.outputs.has_metax == 'true'
    uses: ./.github/workflows/integration-test-metax.yml

  musa-pipeline:
    name: Platform pipeline (musa)
    needs: discover-platforms
    if: needs.discover-platforms.outputs.has_musa == 'true'
    uses: ./.github/workflows/integration-test-musa.yml

  ppu-pipeline:
    name: Platform pipeline (ppu)
    needs: discover-platforms
    if: needs.discover-platforms.outputs.has_ppu == 'true'
    uses: ./.github/workflows/integration-test-ppu.yml

  # Kunlunxin has no dedicated integration-test-<platform>.yml: like gcu it runs
  # the generic all-tests-common.yml. Its config uses integration_wheel_source:
  # artifact, so the common pipeline's build job runs (no run_build: false) and
  # the integration job tests the exact wheel that job produced.
  kunlunxin-pipeline:
    name: Platform pipeline (kunlunxin)
    needs: discover-platforms
    if: needs.discover-platforms.outputs.has_kunlunxin == 'true'
    uses: ./.github/workflows/all-tests-common.yml
    with:
      platform: kunlunxin
