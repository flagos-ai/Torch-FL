name: CI

permissions:
  contents: read
  pull-requests: read
  actions: read

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 CST daily
  push:
    branches: [main, dev, devops, dev-hygon, dev-thead, dev-musa, iluvatar_build_and_test]
  pull_request:
    branches: [main, dev, devops, dev-hygon]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      profile:
        description: pr or full nightly; weekly is reserved
        type: choice
        default: pr
        options: [pr, nightly, weekly]
      platforms:
        description: 'Comma-separated platforms to run, or all'
        required: false
        default: all
        type: string
      pr_number:
        description: 'PR number for a trusted fork on-demand run'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the source repository and immutable commit before any reusable
  # workflow starts. Fork on-demand runs are dispatched from this workflow on
  # the base branch, so the workflow definition remains trusted while the jobs
  # test the PR head commit supplied by the API.
  resolve-checkout:
    name: Resolve checkout source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.resolve.outputs.repository }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve trusted source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.sha }}
          PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          set -euo pipefail

          repository="$EVENT_REPOSITORY"
          ref="$EVENT_REF"
          if [[ -n "$PR_NUMBER" ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::pr_number must be a positive integer"
              exit 1
            fi
            pr=$(gh api "repos/${EVENT_REPOSITORY}/pulls/${PR_NUMBER}")
            repository=$(jq -r '.head.repo.full_name // empty' <<<"$pr")
            ref=$(jq -r '.head.sha // empty' <<<"$pr")
            state=$(jq -r '.state // empty' <<<"$pr")
            if [[ "$state" != "open" ]]; then
              echo "::error::PR #${PR_NUMBER} is not open"
              exit 1
            fi
            if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::PR head repository is unavailable (the fork may have been deleted)"
              exit 1
            fi
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::PR head SHA is not a full commit SHA"
              exit 1
            fi
            echo "Testing PR #${PR_NUMBER} from ${repository}@${ref}"
          fi

          printf 'repository=%s\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

  lint:
    needs: resolve-checkout
    uses: ./.github/workflows/lint.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  # Repository-wide checks that need no accelerator, no vendor image, and no
  # built wheel. They run against the same immutable source as the hardware
  # matrix, so fork on-demand runs test the submitted PR rather than base main.
  agnostic-checks:
    name: Platform-agnostic checks
    needs: [resolve-checkout, lint]
    uses: ./.github/workflows/agnostic-checks.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  codegen-checks:
    name: Codegen checks
    needs: [resolve-checkout, lint]
    uses: ./.github/workflows/codegen-checks.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  discover-platforms:
    name: Discover platforms
    needs: [resolve-checkout, lint, agnostic-checks, codegen-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.detect.outputs.platforms }}
      context: ${{ steps.detect.outputs.context }}
      plan_artifact: ${{ steps.detect.outputs.artifact_name }}
    steps:
      - name: Checkout trusted plan code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout source data
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-checkout.outputs.repository }}
          ref: ${{ needs.resolve-checkout.outputs.ref }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Install plan parser
        run: python -m pip install "PyYAML==6.0.2"
      - name: Plan selected platforms and execution
        id: detect
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve-checkout.outputs.repository }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH_PLATFORMS: ${{ inputs.platforms || '' }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || inputs.profile || 'pr' }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python control/.github/scripts/flagcicd_plan.py
          --ci --source source --output flagcicd-plan.json
      - name: Retain execution plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.detect.outputs.artifact_name }}
          path: flagcicd-plan.json
          if-no-files-found: error
          retention-days: 14

  # One hardware pipeline per configured platform. The reusable workflow reads
  # runner, image, timeout, and test groups from the validated plan snapshot.
  #
  # fail-fast is off on purpose. The PR is red whatever the other lanes do, so
  # cancelling them on the first failure saves accelerator time only when the
  # failure is the *only* one -- and that is exactly the case that is not true
  # here. A cancelling matrix reports the first red and nothing else: fix it,
  # push, wait a full round, and the next run reports the next. The cost is paid
  # on every lane that turned out to be fine anyway (a cancelled lane is not a
  # measurement), which is why the platform set stays as narrow as the diff
  # allows (paths_watch in .github/configs/<platform>.yml). Letting every
  # selected lane finish turns N rounds into one and still fails `CI complete`
  # for any lane that did not pass -- see tests/unit/test_ci_fail_fast.py.
  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: [resolve-checkout, discover-platforms]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.discover-platforms.outputs.platforms) }}
    uses: ./.github/workflows/integration-tests.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      platform: ${{ matrix.platform }}
      test_profile: ${{ github.event_name == 'schedule' && 'nightly' || inputs.profile || 'pr' }}
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}
      execution_plan_artifact: ${{ needs.discover-platforms.outputs.plan_artifact || 'missing-required-execution-plan' }}
      execution_plan_context: ${{ needs.discover-platforms.outputs.context }}

  # Single required-check gate for branch protection.
  ci-complete:
    name: CI complete
    if: always()
    needs:
      - resolve-checkout
      - lint
      - agnostic-checks
      - codegen-checks
      - discover-platforms
      - platform-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted report code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download execution plan
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ needs.discover-platforms.outputs.plan_artifact || 'missing-required-execution-plan' }}
          path: execution-plan
      - name: Download platform outcomes
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: flagcicd-platform-*
          path: platform-reports
      - name: Aggregate and check planned execution
        env:
          GH_TOKEN: ${{ github.token }}
          FLAGCICD_PLAN: ${{ needs.discover-platforms.outputs.context }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: >-
          python .github/scripts/flagcicd_report.py summary --entry ci --diagnostics
          --plan-file execution-plan/flagcicd-plan.json
          --directory platform-reports --output flagcicd-run-summary.json
      - name: Retain run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagcicd-run-summary-${{ github.run_attempt }}
          path: flagcicd-run-summary.json
          if-no-files-found: error
          retention-days: 14
