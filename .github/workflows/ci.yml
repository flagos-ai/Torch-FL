name: CI

on:
  push:

    branches: [main, dev, devops, dev-hygon, dev-thead, ci-all]

    paths:
      - "cmake/**"
      - "csrc/**"
      - "include/**"
      - "scripts/**"
      - "tests/**"
      - "torch_fl/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "setup.py"
      - ".github/configs/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, dev, devops, dev-hygon]
    paths:
      - "cmake/**"
      - "csrc/**"
      - "include/**"
      - "scripts/**"
      - "tests/**"
      - "torch_fl/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "setup.py"
      - ".github/configs/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  discover-platforms:
    name: Discover platforms
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.detect.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      # Every .github/configs/*.yml is a platform, and every platform runs the
      # same pipeline. Adding a config is the only step needed to add a platform:
      # no per-vendor job, and no allowlist to keep in sync here.
      - name: Detect configured platforms
        id: detect
        run: |
          set -euo pipefail
          platforms=$(find .github/configs -maxdepth 1 -type f -name '*.yml' \
            -exec basename {} .yml \; | sort | jq -R -s -c 'split("\n")[:-1]')
          if [[ "$platforms" == "[]" ]]; then
            echo "::error::No platform configs found"
            exit 1
          fi
          echo "Discovered platforms: $platforms"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: discover-platforms
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.discover-platforms.outputs.platforms) }}
    uses: ./.github/workflows/all-tests-common.yml
    with:
      platform: ${{ matrix.platform }}
      # Debug-phase toggle: skip wheel artifact upload while iterating on the
      # integration tests -- green-run wheels are unused during debugging and
      # only consume storage. Flip to true (or drop this line) at final
      # delivery so release/provenance wheels are retained again.
      upload_artifact: false
