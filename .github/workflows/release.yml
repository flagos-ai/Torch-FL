# Tag a release, get the wheels.
#
# Push `v2.10.0` and this builds the wheel on every publishing platform's own
# runner and uploads each one to the vendor PyPI lane it belongs to -- build and
# upload in the same job, on the same runner. The tag names the release and each
# wheel's local segment names its SDK, so `v2.10.0` produces
# `torch_fl-2.10.0+cuda13.3`, `torch_fl-2.10.0+dtk2604`, and so on: one release,
# one artifact per platform.
#
# The build jobs reuse the `build-wheel-*.yml` wrappers the CI pipelines already
# call, so a release builds exactly what CI verified (same image, same setup
# hook, same wheel build, and the same `Verify wheel` step that re-installs the
# artifact before it is offered here). Nothing about the build is release-only;
# `publish: true` is the only release-specific input.
#
# Uploading from the platform's own job is deliberate, and is how
# flagos-ai/build-infra releases its own wheels. The other shape -- one
# GitHub-hosted job downloading all seven artifacts and pushing them to Nexus --
# put 2.35 GB on a cross-border link at ~0.13 MB/s and was killed by its own
# 60-minute timeout on v2.10.0rc1, while the same bytes uploaded from a runner in
# China at 13-23 MB/s. GitHub's own artifact hop is not the cost: that run moved
# all seven artifacts in 22 seconds. Where each wheel goes is the `pypi_lane`
# column of cmake/flagos_platforms.json; the upload itself is
# .github/scripts/publish_wheels.py, run per platform by `build-wheel-common.yml`.
#
# Credentials: the organization secret NEXUS_TOKEN, in `user:token` form -- the
# same one flagos-ai/build-infra uses. Publishing from each platform's own job
# means it now reaches every vendor runner, with write access to every vendor
# lane; the guard that travels with it is publish_wheels.py's version check,
# which refuses to publish a wheel whose base version is not the tag, plus the
# ref check that refuses to publish from anything but a tag. It is mapped
# explicitly at every `uses:` hop, because `secrets: inherit` is not transitive.
# No per-repo secret is needed; if the organization secret is not visible to this
# repository, each build job fails on an empty token before it builds anything
# rather than uploading nothing quietly.
#
# Recovering a single failed lane: each wheel is still uploaded as a workflow
# artifact, so `gh run download <run-id> --pattern 'wheel-<platform>'` plus a
# local `python .github/scripts/publish_wheels.py --wheels <dir> --tag <tag>`
# re-uploads just that lane in about a minute, without rebuilding anything. The
# version check makes it a no-op for lanes that already have the wheel. See
# docs/development/releasing.md.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release from (dispatch this workflow from that tag's ref)"
        required: true

permissions:
  contents: read

jobs:
  # The tag decides whether this is a release at all. Mirrors the guard in
  # flagos-ai/build-infra/.github/workflows/upload-nexus.yml so the two agree:
  # a bare version tag publishes, a variant or pre-release tag does not, and a
  # manual dispatch always does.
  guard:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Read the tag
        id: check
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ]; then
            # The wheels are built from this run's ref, and the pre-release
            # suffix comes from the ref too, so a dispatch from a branch would
            # publish a branch tip under the tag's version in the wrong wheel
            # version. Requiring the tag makes the input description true and
            # makes the dispatch path a real re-run.
            if [ "$DISPATCH_TAG" != "$REF_NAME" ]; then
              echo "::error::This workflow builds from its own ref. Dispatch it from the tag's ref (the 'Use workflow from' selector) rather than from a branch: ref is '${REF_NAME}', tag input is '${DISPATCH_TAG}'."
              exit 1
            fi
            echo "tag=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch for ${DISPATCH_TAG} - publishing."
            exit 0
          fi
          echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          stable='^v?[0-9]+(\.[0-9]+){0,3}(\.post[0-9]+)?$'
          prerelease='^v?[0-9]+(\.[0-9]+){0,3}(a|b|rc)[0-9]+$'
          if [[ "$REF_NAME" =~ $stable ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Stable release tag '${REF_NAME}' - publishing."
          elif [[ "$REF_NAME" =~ $prerelease ]]; then
            # A release candidate publishes too, deliberately: a candidate
            # nobody can install cannot be tested, which is the only reason to
            # cut one. It cannot be mistaken for the release -- the suffix is in
            # the version (`torch_fl-2.10.0rc1+cuda13.3`), where PEP 440 sorts
            # it below `2.10.0`.
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release tag '${REF_NAME}' - publishing the candidate."
          else
            # A variant tag like v2.10.0+cuda13.3, or any spelling this does not
            # recognise. The organization's shared uploader would skip these for
            # a stable release, so they are not published here by surprise
            # either; workflow_dispatch is the deliberate way through.
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Non-release tag '${REF_NAME}' - building nothing. Re-run this workflow with workflow_dispatch to release it deliberately."
          fi

  # One job per publishing platform, spelled out rather than a matrix: each has
  # its own runner label, image and timeout, which is the shape ci.yml uses too.
  # Every one of them carries the upload with it.
  build-cuda:
    if: needs.guard.outputs.publish == 'true'
    needs: guard
    uses: ./.github/workflows/build-wheel-cuda.yml
    with:
      publish: true
    secrets:
      NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}

  build-dcu:
    if: needs.guard.outputs.publish == 'true'
    needs: guard
    uses: ./.github/workflows/build-wheel-dcu.yml
    with:
      publish: true
    secrets:
      NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}

  build-musa:
    if: needs.guard.outputs.publish == 'true'
    needs: guard
    uses: ./.github/workflows/build-wheel-musa.yml
    with:
      publish: true
    secrets:
      NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}

  build-ascend:
    if: needs.guard.outputs.publish == 'true'
    needs: guard
    uses: ./.github/workflows/build-wheel-ascend.yml
    with:
      publish: true
    secrets:
      NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}

  build-metax:
    if: needs.guard.outputs.publish == 'true'
    needs: guard
    uses: ./.github/workflows/build-wheel-metax.yml
    with:
      publish: true
    secrets:
      NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}

  build-ppu:
    if: needs.guard.outputs.publish == 'true'
    needs: guard
    uses: ./.github/workflows/build-wheel-ppu.yml
    with:
      publish: true
    secrets:
      NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}

  # GCU is the one platform with no build-wheel-* wrapper: it is the only
  # "common" platform (its runner is not one of the six vendor pipelines), so
  # ci.yml drives it straight through all-tests-common.yml. Its build is called
  # the same way here, with the same inputs build-wheel-<vendor>.yml passes.
  build-gcu:
    if: needs.guard.outputs.publish == 'true'
    needs: guard
    uses: ./.github/workflows/all-tests-common.yml
    with:
      platform: gcu
      run_build: true
      run_integration_tests: false
      upload_artifact: true
      publish: true
    secrets:
      NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
