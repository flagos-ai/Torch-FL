# A supplemental workflow: preserve CI failures unless every root job has a
# recognized network error. Never execute scripts from the failed PR checkout.
name: Flaky Test Retry

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: flaky-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: Retry a transient network failure once
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted retry policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/ci

      - name: Inspect root failures and request a bounded retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci/flaky_retry.py
