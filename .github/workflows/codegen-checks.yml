# Codegen staleness and conf/registration consistency gates.
#
# Runs every generator's ``--check`` mode that works without a vendor toolkit
# or a built torch_fl, plus the pure-text consistency tests. A stale generated
# file or a conf route with no registration behind it fails this job with the
# regen command in the log, so drift surfaces in seconds on ubuntu-latest
# instead of as a "backend not registered" raise on a hardware runner.
#
# Generators that need vendor ATen headers (codegen_ascend, codegen_gcu,
# codegen_mudnn) or an importable built torch_fl (codegen_ops, codegen_autograd,
# codegen_tileops) are NOT run here -- see scripts/README.md for the manual
# regen contract on those.

name: Codegen checks

on:
  workflow_call:
    inputs:
      checkout_repository:
        required: false
        type: string
        default: ''
      checkout_ref:
        required: false
        type: string
        default: ''
  workflow_dispatch:

jobs:
  codegen-checks:
    name: Codegen staleness and conf consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU torch and codegen deps
        run: |
          # The FlagGems register generators import codegen_mudnn -> codegen_ops,
          # which needs torchgen (shipped with torch) at import time. Stock CPU
          # torch is enough: no built torch_fl._C and no vendor toolkit.
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.10.0"
          pip install pyyaml pytest

      - name: Run generator --check modes
        run: |
          set -euo pipefail
          echo "=== gen_vendor_confs.py --check ==="
          python3 scripts/codegen/gen_vendor_confs.py --check
          # Regenerates the per-platform FlagGems register lists that a
          # FlagGems-primary CUDA-ABI build (FLAGOS_BUILD_BOXING=OFF) compiles
          # instead of the full generated/register.inc. Reads only committed
          # sources, so --check needs no vendor toolkit.
          echo "=== codegen_boxing_flaggems_register.py --check ==="
          python3 scripts/codegen/codegen_boxing_flaggems_register.py --check
          echo "=== codegen_gcu_flaggems.py --check ==="
          python3 scripts/codegen/codegen_gcu_flaggems.py --check
          echo "=== codegen_musa_flaggems.py --check ==="
          python3 scripts/codegen/codegen_musa_flaggems.py --check
          echo "=== codegen_iluvatar_flaggems.py --check ==="
          python3 scripts/codegen/codegen_iluvatar_flaggems.py --check
          # Re-renders the CUPTI cbid -> name table's .inc from the committed
          # .txt, so it needs no vendor header and no GPU -- which is the reason
          # the table is committed as two artifacts rather than parsed from
          # cupti_runtime_cbid.h at build time.
          echo "=== gen_cupti_runtime_cbid.py --check ==="
          python3 scripts/codegen/gen_cupti_runtime_cbid.py --check
          # Reads only committed sources (the shared generated/register.inc and
          # its own op table) and writes two files, so --check needs no vendor
          # toolkit and no built torch_fl -- only the torchgen that ships with
          # the CPU torch installed above.
          echo "=== codegen_kunlunxin.py --check ==="
          python3 scripts/codegen/codegen_kunlunxin.py --check
          # Same contract as kunlunxin: reads the shared generated/register.inc
          # plus the committed iluvatar_flaggems_register.inc and its own op
          # table, writes iluvatar_kernels.cc / iluvatar_register.inc. No vendor
          # toolkit and no built torch_fl -- only the CPU torchgen above.
          echo "=== codegen_iluvatar.py --check ==="
          python3 scripts/codegen/codegen_iluvatar.py --check
          # The Apple Metal (MPSGraph) operator layer. Reads only committed
          # sources (generated/register.inc to cross-check the op names) and
          # imports codegen_ops for the dispatcher naming, so --check needs no
          # vendor toolkit, no macOS and no built torch_fl -- only the torchgen
          # that ships with the CPU torch installed above.
          echo "=== codegen_mps.py --check ==="
          python3 scripts/codegen/codegen_mps.py --check

      - name: Run conf/registration consistency tests
        run: |
          set -euo pipefail
          python3 -m pytest \
            tests/unit/test_conf_registration_consistency.py \
            tests/unit/test_gen_vendor_confs.py \
            -v --tb=short -p no:cacheprovider

      - name: Run FlagGems conf/codegen consistency tests
        run: |
          set -euo pipefail
          # --noconftest: the tests are pure text/parse and the integration
          # conftest imports torch_fl at configure time, which needs a built
          # wheel. These tests read only committed sources.
          python3 -m pytest \
            tests/integration/ops/test_flaggems_conf_consistency.py \
            --noconftest -v --tb=short -p no:cacheprovider
