name: Common Integration Tests

on:
  workflow_call:
    inputs:
      display_name:
        required: true
        type: string
      setup_script:
        required: true
        type: string
      image:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
      artifact_name:
        required: true
        type: string
      wheel_source:
        required: true
        type: string
      integration_tests:
        required: true
        type: string
      integration_environment:
        required: true
        type: string

jobs:
  integration-tests:
    name: Integration tests (${{ inputs.display_name }})
    runs-on: ${{ fromJson(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    container:
      image: ${{ inputs.image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform environment
        env:
          CI_STAGE: integration
        run: bash "${{ inputs.setup_script }}"

      - name: Download wheel artifact
        if: inputs.wheel_source == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: Build wheel for standalone integration
        if: inputs.wheel_source == 'local-build'
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --no-isolation

      - name: Validate wheel compatibility manifest
        run: python -m torch_fl_preflight --wheel dist/*.whl --platform "$FLAGOS_ACCELERATOR" --check-build-env

      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip install pytest

      - name: Prepare wheel-only test workspace
        run: |
          TEST_ROOT=$(mktemp -d "${RUNNER_TEMP:-/tmp}/torch-fl-integration.XXXXXX")
          cp -a tests pyproject.toml "$TEST_ROOT/"
          printf 'INTEGRATION_WORKDIR=%s\n' "$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Run configured integration tests
        env:
          INTEGRATION_TESTS: ${{ inputs.integration_tests }}
          INTEGRATION_ENVIRONMENT: ${{ inputs.integration_environment }}
        run: |
          set -euo pipefail
          python .github/scripts/run_integration_tests.py
