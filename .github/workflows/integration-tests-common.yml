name: Common Integration Tests

on:
  workflow_call:
    inputs:
      display_name:
        required: true
        type: string
      setup_script:
        required: true
        type: string
      image:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
      artifact_name:
        required: true
        type: string
      wheel_source:
        required: true
        type: string
      integration_tests:
        required: true
        type: string
      integration_environment:
        required: true
        type: string

jobs:
  integration-tests:
    name: Integration tests (${{ inputs.display_name }})
    runs-on: ${{ fromJson(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    container:
      image: ${{ inputs.image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Self-hosted runners accumulate stale wheels across runs (pip no longer
      # passes --no-cache-dir); wipe before restore so the uploaded archive stays
      # bounded to this run's downloads. The GCU container's /github/home mount
      # is not writable by the runtime user, so the pip cache lives under
      # RUNNER_TEMP (see PIP_CACHE_DIR in set_env_gcu.sh); wipe that path here.
      - name: Reset pip cache dir
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/pip-cache"

      # Cache pip downloads across runs. The cache only skips the download,
      # not the install, so the environment prepared by the setup script is
      # still rebuilt fresh each run. PIP_CACHE_DIR is persisted to
      # $GITHUB_ENV by the setup script, so pip invocations in later steps
      # (install wheel, pytest) share the cache directory, not just the
      # set_env step's shell.
      #
      # The key carries an -integration- stage suffix: this job and the build
      # job share display_name via all-tests-common, so without the suffix an
      # exact hit on the build cache would skip the save and discard the
      # integration-only downloads (pytest, test deps). restore-keys fall back
      # to the build prefix so the build cache is reused, then to the legacy
      # unsuffixed key for migration. The setup script is hashed because the
      # real version pins live there, not in pyproject/setup.py.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pip-cache
          key: ${{ inputs.display_name }}-integration-pip-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'setup.py', '.github/scripts/set_env_*.sh') }}
          restore-keys: |
            ${{ inputs.display_name }}-integration-pip-${{ runner.os }}-
            ${{ inputs.display_name }}-build-pip-${{ runner.os }}-
            ${{ inputs.display_name }}-pip-${{ runner.os }}-

      - name: Prepare platform environment
        env:
          CI_STAGE: integration
        run: bash "${{ inputs.setup_script }}"

      - name: Download wheel artifact
        if: inputs.wheel_source == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: Build wheel for standalone integration
        if: inputs.wheel_source == 'local-build'
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --no-isolation

      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip install pytest

      - name: Prepare wheel-only test workspace
        run: |
          TEST_ROOT=$(mktemp -d "${RUNNER_TEMP:-/tmp}/torch-fl-integration.XXXXXX")
          cp -a tests pyproject.toml "$TEST_ROOT/"
          printf 'INTEGRATION_WORKDIR=%s\n' "$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Run configured integration tests
        env:
          INTEGRATION_TESTS: ${{ inputs.integration_tests }}
          INTEGRATION_ENVIRONMENT: ${{ inputs.integration_environment }}
        run: |
          set -euo pipefail
          python .github/scripts/run_integration_tests.py
