# Commands run from the default branch, with code from the resolved PR commit.
# Only repository writers can start hardware jobs through this privileged route.
name: Slash command (/ci)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: slash-command-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Handle /ci command
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted control scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci
            .github/configs

      - name: Install configuration parser
        run: python -m pip install PyYAML

      - name: Handle maintainer command
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci/slash_command.py
