name: Integration Tests (CUDA)

on:
  workflow_call:
    inputs:
      # Longer than the other platforms: this job builds the accelerator payload
      # (CUDA PyTorch, the FlagGems C++ operators) that a prebuilt image used to
      # supply, so it spends minutes the image-based jobs spend on a pull.
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 120
  workflow_dispatch:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 120

jobs:
  # The test list lives in .github/configs/cuda.yml, not inline here. See
  # load-platform-tests.yml for why.
  load-tests:
    uses: ./.github/workflows/load-platform-tests.yml
    with:
      platform: cuda

  integration-tests:
    name: Build and test (CUDA)
    needs: load-tests
    runs-on:
      - torch-fl-nv
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    container:
      # The FlagOS CUDA image rather than a stock NVIDIA one: it already carries
      # the CUDA PyTorch and the FlagGems C++ operators that `set_env_cuda.sh`
      # would otherwise have to produce in the job, and its Ubuntu 24.04 userland
      # is the glibc baseline the FlagTree wheels this job installs are built
      # for. The CUDA line it ships is 13.0, which is what the script's cu130
      # PyTorch pin and its `torch.version.cuda == "13.0"` assertion expect.
      image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl@sha256:eea3302ee25e0e3390aef4aa1a603dfe03aa93ab043f1571cb86f7a2a3026e02
      volumes:
        - /data/models/Qwen/Qwen3-0.6B:/models/Qwen3-0.6B:ro
      options: >-
        --gpus all
        --ipc=host
        --shm-size=512g
        --ulimit memlock=-1
        --cap-add=SYS_PTRACE
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Self-hosted runners accumulate stale wheels in ~/.cache/pip across
      # runs (pip no longer passes --no-cache-dir); wipe before restore so
      # the uploaded archive stays bounded to this run's downloads.
      - name: Reset pip cache dir
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/pip-cache"

      # Restore pip downloads from a previous run so the smaller venv-side
      # wheels (transformers, flagtree, pytest) are fetched once and reused.
      # The giant CUDA and CPU torch wheels are excluded via --no-cache-dir in
      # set_env_cuda.sh (they download fast from pytorch.org and would bloat
      # the archive past the self-hosted runner's upload capacity). The cache
      # only skips the download, not the install, so the isolated venv is still
      # rebuilt fresh each run. PIP_CACHE_DIR is persisted to $GITHUB_ENV by
      # set_env_cuda.sh so every step shares the cache directory.
      #
      # Save is split out to an explicit actions/cache/save step at the end of
      # the job (see "Save pip downloads") so it can carry a timeout-minutes:
      # the actions/cache@v4 post-run save hook ignores step timeout-minutes,
      # and on the CUDA runner an upload stall would otherwise hold the
      # torch-fl-nv runner indefinitely and block queued jobs.
      #
      # set_env_cuda.sh is hashed because the real version pins (torch,
      # flagtree, FlagGems revision) live there; without it a pin bump leaves
      # the key unchanged, the exact-hit skips the save, and the new wheels are
      # discarded every run.
      - name: Restore pip downloads
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pip-cache
          key: cuda-pip-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml', 'setup.py', '.github/scripts/set_env_cuda.sh') }}
          restore-keys: |
            cuda-pip-${{ runner.os }}-py312-
        timeout-minutes: 5

      - name: Prepare CUDA build environment
        env:
          CI_STAGE: integration
        run: bash .github/scripts/set_env_cuda.sh

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Prepare wheel-only test workspace
        run: |
          TEST_ROOT=$(mktemp -d "${RUNNER_TEMP:-/tmp}/torch-fl-cuda.XXXXXX")
          cp -a tests pyproject.toml "$TEST_ROOT/"
          printf 'INTEGRATION_WORKDIR=%s\n' "$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Run CUDA integration tests
        env:
          INTEGRATION_TESTS: ${{ needs.load-tests.outputs.integration_tests }}
          INTEGRATION_ENVIRONMENT: ${{ needs.load-tests.outputs.integration_environment }}
        run: python .github/scripts/run_integration_tests.py

      # Explicit save (split from actions/cache/restore above) so a stuck
      # upload on the CUDA runner is cancelled by timeout-minutes instead of
      # holding torch-fl-nv indefinitely and blocking queued jobs. The
      # actions/cache@v4 post-run save hook ignores step timeout-minutes,
      # which is why restore+save are split here rather than using the
      # combined action. if: always() so a cache entry is still produced when
      # an earlier step fails; the save action no-ops when the key already
      # exists (exact restore hit), so there is no redundant upload.
      - name: Save pip downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pip-cache
          key: cuda-pip-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml', 'setup.py', '.github/scripts/set_env_cuda.sh') }}
        timeout-minutes: 10
