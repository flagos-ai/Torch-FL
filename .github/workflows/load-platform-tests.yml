# Reads the integration test list for one platform out of .github/configs/.
#
# The dedicated per-platform pipelines (ascend, cuda, dcu, metax) keep their own
# hardcoded runner labels and container images, but used to carry a second copy
# of the test list inline as JSON. That duplication silently went stale: a step
# renamed in .github/configs/ kept running the old command on hardware, and a
# test file deleted in the repo kept being invoked until the job failed. This
# job makes the manifest in .github/configs/<platform>.yml the only source of
# truth for what runs, without moving the hardware jobs onto a shared runner.
#
# It deliberately runs on ubuntu-latest: yq and the parsing happen off the
# vendor image, so no accelerator container needs a YAML dependency installed.

name: Load platform test manifest

on:
  workflow_call:
    inputs:
      platform:
        description: Config basename under .github/configs (without .yml)
        required: true
        type: string
    outputs:
      integration_tests:
        description: integration_tests from the platform config, as JSON
        value: ${{ jobs.load.outputs.integration_tests }}
      integration_environment:
        description: integration_environment from the platform config, as JSON
        value: ${{ jobs.load.outputs.integration_environment }}

jobs:
  load:
    name: Load configuration (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      integration_tests: ${{ steps.config.outputs.integration_tests }}
      integration_environment: ${{ steps.config.outputs.integration_environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Read integration test manifest
        id: config
        run: |
          set -euo pipefail

          PLATFORM="${{ inputs.platform }}"
          CONFIG_FILE=".github/configs/${PLATFORM}.yml"

          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "::error::Platform config not found: $CONFIG_FILE"
            exit 1
          fi

          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          INTEGRATION_TESTS=$(yq -o=json -I=0 '.integration_tests // []' "$CONFIG_FILE")
          INTEGRATION_ENVIRONMENT=$(yq -o=json -I=0 '.integration_environment // {}' "$CONFIG_FILE")

          # Same validation the shared pipeline applies, so a malformed manifest
          # fails here in seconds instead of after a multi-minute vendor build.
          INTEGRATION_TESTS="$INTEGRATION_TESTS" \
          INTEGRATION_ENVIRONMENT="$INTEGRATION_ENVIRONMENT" \
            python .github/scripts/run_integration_tests.py --validate-only

          printf '%s=%s\n' integration_tests "$INTEGRATION_TESTS" >> "$GITHUB_OUTPUT"
          printf '%s=%s\n' integration_environment "$INTEGRATION_ENVIRONMENT" >> "$GITHUB_OUTPUT"
