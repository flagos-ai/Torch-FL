name: Common Wheel Build

on:
  workflow_call:
    inputs:
      display_name:
        required: true
        type: string
      setup_script:
        required: true
        type: string
      image:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
      artifact_name:
        required: true
        type: string
      upload_artifact:
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build wheel (${{ inputs.display_name }})
    runs-on: ${{ fromJson(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    container:
      image: ${{ inputs.image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform environment
        env:
          CI_STAGE: build
        run: bash "${{ inputs.setup_script }}"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build --wheel --no-isolation

      - name: Validate wheel compatibility manifest
        run: python scripts/tools/torch-fl-preflight --wheel dist/*.whl --platform "$FLAGOS_ACCELERATOR" --check-build-env

      - name: Verify wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          from importlib.metadata import files, metadata

          package_metadata = metadata("torch_fl")
          package_files = [str(path) for path in files("torch_fl")]
          assert any("torch_fl" in path for path in package_files), (
              "torch_fl module not found in wheel"
          )
          assert any(path.endswith("torch-fl-preflight") for path in package_files), (
              "Installed wheel is missing the preflight script"
          )
          print(f"Package: {package_metadata['Name']} {package_metadata['Version']}")
          print(f"Installed files: {len(package_files)}")
          PY

      - name: Upload wheel
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*.whl
