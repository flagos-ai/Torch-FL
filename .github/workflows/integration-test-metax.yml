name: Integration Tests (MetaX)

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 60
  workflow_dispatch:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 60

jobs:
  integration-tests:
    name: Build and test (MetaX)
    runs-on:
      - mx-8g-cicd-pytorch
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    container:
      image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260731-metax-dev
      options: >-
        --privileged
        --ipc=host
        --shm-size=512g
        --ulimit memlock=-1
        --cap-add=SYS_PTRACE
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Prepare MetaX build environment
        env:
          CI_STAGE: integration
        run: bash .github/scripts/set_env_metax.sh

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Prepare wheel-only test workspace
        run: |
          TEST_ROOT=$(mktemp -d "${RUNNER_TEMP:-/tmp}/torch-fl-metax.XXXXXX")
          cp -a tests pyproject.toml "$TEST_ROOT/"
          printf 'INTEGRATION_WORKDIR=%s\n' "$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Run MetaX integration tests
        env:
          INTEGRATION_ENVIRONMENT: "{}"
          INTEGRATION_TESTS: >-
            [{"name":"Diagnose bundled MetaX ELF symbols (temporary)","command":"python - <<'PY'\nfrom pathlib import Path\nimport sysconfig\n\npackage_root = Path(sysconfig.get_paths()[\"purelib\"]) / \"torch_fl\"\nsymbol = \"_ZN2at6native6flagos29GetFlagosDefaultCudaGeneratorEl\"\nlibraries = [package_root / \"lib\" / \"libtorch_fl.so\"]\nlibraries.extend(sorted((package_root / \"lib_maca\").glob(\"*.so*\")))\n\nprint(f\"package_root={package_root}\")\nprint(f\"symbol={symbol}\")\nfor library in libraries:\n    print(f\"--- {library}\")\n    print(f\"exists={library.is_file()}\")\nPY\nSYM='_ZN2at6native6flagos29GetFlagosDefaultCudaGeneratorEl'\nROOT=\"$(python -c 'import sysconfig; from pathlib import Path; print(Path(sysconfig.get_paths()[\"purelib\"]) / \"torch_fl\")')\"\nfor lib in \"$ROOT/lib/libtorch_fl.so\" \"$ROOT\"/lib_maca/*.so*; do\n  [[ -f \"$lib\" ]] || continue\n  echo \"--- $lib\"\n  nm -D --defined-only \"$lib\" 2>/dev/null | grep \"$SYM\" || true\ndone\nfor lib in \"$ROOT/lib\"/libflagos.so* \"$ROOT/lib\"/libtorch_bindings.so* \\\n           /opt/maca/lib/*.so* /opt/maca/tools/cu-bridge/lib/*.so*; do\n  [[ -f \"$lib\" ]] || continue\n  nm -D --defined-only \"$lib\" 2>/dev/null | grep \"$SYM\" && echo \"provider=$lib\" || true\ndone\nreadelf -d \"$ROOT/lib/libtorch_fl.so\" | grep 'NEEDED\\|RPATH\\|RUNPATH' || true\n"},{"name":"Check isolated MetaX environment","command":"python - <<'PY'\nfrom pathlib import Path\n\nimport torch_fl\nimport torch\n\ntorch_fl_path = Path(torch_fl.__file__).resolve()\ntorch_path = Path(torch.__file__).resolve()\n\nassert torch.__version__.startswith(\"2.10.0+cpu\"), torch.__version__\nassert str(torch_path).startswith(\"/opt/venv/\"), torch_path\nassert \"/opt/conda/\" not in str(torch_path), torch_path\nassert torch.cuda.is_available(), \"MetaX devices are unavailable\"\nassert torch.cuda.device_count() == 8, torch.cuda.device_count()\nassert torch_fl.flagos.is_available(), \"flagos device is unavailable\"\nassert torch_fl.flagos.device_count() == 8, torch_fl.flagos.device_count()\n\nprint(f\"PyTorch: {torch.__version__}\")\nprint(f\"torch: {torch_path}\")\nprint(f\"torch_fl: {torch_fl_path}\")\nprint(f\"MetaX devices: {torch.cuda.device_count()}\")\nprint(f\"flagos devices: {torch_fl.flagos.device_count()}\")\nPY\n"},{"name":"Run representative MetaX operator tests","command":"python -m pytest tests/integration/ops/test_abs_dispatch.py tests/integration/ops/test_add_dispatch.py tests/integration/ops/test_bmm_dispatch.py tests/integration/ops/test_cat_dispatch.py tests/integration/ops/test_div_scalar_dispatch.py tests/integration/ops/test_embedding_dispatch.py tests/integration/ops/test_mean_dispatch.py tests/integration/ops/test_mm_dispatch.py tests/integration/ops/test_mul_dispatch.py tests/integration/ops/test_mul_scalar_dispatch.py tests/integration/ops/test_neg_dispatch.py tests/integration/ops/test_nll_loss_dispatch.py tests/integration/ops/test_silu_dispatch.py tests/integration/ops/test_softmax_dispatch.py tests/integration/ops/test_sum_dispatch.py tests/integration/ops/test_where_dispatch.py -m \"not flaggems and not flaggems_python and not flaggems_cpp\" --maxfail=1 -v -s --tb=long"},{"name":"Run MetaX RNG tests","command":"python -m pytest tests/integration/ops/test_rng_dispatch.py -m \"main_ops\" -v -s --tb=short"},{"name":"Run general factory and autograd tests","command":"python -m pytest tests/integration/test_factory_ops.py -v -s --tb=short"},{"name":"Run torch.compile tests","command":"python -m pytest tests/integration/test_compile.py -v --tb=short"}]
        run: python .github/scripts/run_integration_tests.py
