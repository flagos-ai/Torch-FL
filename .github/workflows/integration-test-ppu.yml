# Compatibility entry point. The pipeline now lives in all-tests-common.yml and
# is driven entirely by .github/configs/ppu.yml, which used to be duplicated
# inline here (image, AliXPU --device list, container options). This file keeps
# the "Integration Tests (PPU)" workflow name and its manual dispatch working;
# see .github/workflows/MIGRATION_NOTES.md for the required-check rename.

name: Integration Tests (PPU)

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 60
  workflow_dispatch:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 60

jobs:
  pipeline:
    uses: ./.github/workflows/all-tests-common.yml
    with:
      platform: ppu
      timeout_minutes: ${{ inputs['timeout-minutes'] }}
