# MUSA runs native mudnn kernels, not CUDA boxing: the toolkit ships no cudart
# and the wheel builds against stock CPU PyTorch 2.10 (see
# docs/vendors/musa/installation.md). The vendor torch_musa in the base image is
# never imported; set_env_musa.sh asserts it stayed out of the isolated venv.
#
# The operator group selects `(anyplatform or main_ops)` minus the FlagGems
# markers, the same shape GCU and MetaX use. Those tests hold on MUSA because
# conftest's platform gate only skips the cuda/metax/ascend/flaggems_python
# markers on this backend. test_musa_dispatch.py runs as an additive group with
# `-m musa`, asserting ops route to the musa backend and match the CPU reference.
#
# FlagGems is not wired here: this image ships no MThreads Triton/FlagGems stack
# (the vendor flagtree wheel is absent). The hybrid routing can be added once
# that backend is provisioned, the same way GCU defers it. A generic PyPI triton
# is not a substitute and is not installed in its place.
#
# The compile, profiler, inference and training groups run for real. Where the
# MThreads stack does not yet support them the group fails, and that failure is
# the record for the platform owners: it is not skipped, deselected or xfailed.

display_name: MUSA

setup_script: .github/scripts/set_env_musa.sh

ci_image: registry.mthreads.com/mcconline/musa-pytorch-release-public:rc5.1.0-v2.9.1-S5000-py310_tef

runner_labels:
  - mt-8g-cicd-pytorch

container_volumes:
  - /data/models/Qwen/Qwen3-0.6B:/models/Qwen3-0.6B:ro

integration_environment:
  MODEL_PATH: /models/Qwen3-0.6B

container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE
  --env MTHREADS_VISIBLE_DEVICES=all

timeout_minutes: 60
wheel_artifact_name: wheel-musa

# Native mudnn kernels on a stock CPU Torch: no cudart, and the vendor 2.9.1
# torch_musa ABI must never be the Torch under test.
torch_contract:
  base_version: "2.10.0"
  local_version: cpu
  cuda: none
  forbidden_torch_paths:
    - /opt/conda/
    - torch_musa

integration_tests:
  - id: model-availability
    name: Check model availability
    phase: preflight
    failure_policy: fail-fast
    command: |
      test -f "$MODEL_PATH/config.json" || { echo "::error::Missing config.json"; exit 1; }
      test -f "$MODEL_PATH/tokenizer_config.json" || { echo "::error::Missing tokenizer_config.json"; exit 1; }
      ls "$MODEL_PATH"/*.safetensors >/dev/null 2>&1 || ls "$MODEL_PATH"/*.bin >/dev/null 2>&1 || { echo "::error::Missing weight files"; exit 1; }

  - id: device-availability
    name: Check device availability
    phase: preflight
    failure_policy: fail-fast
    command: |
      python - <<'PY'
      import importlib.util
      from pathlib import Path

      import torch_fl
      import torch

      torch_path = Path(torch.__file__).resolve()
      package_lib = Path(torch_fl.__file__).resolve().parent / "lib"

      assert torch.version.cuda is None, torch.version.cuda
      assert "/opt/conda/" not in str(torch_path), torch_path
      assert (package_lib / "libtorch_fl.so").is_file(), package_lib
      # MUSA is native, not CUDA boxing: no cudart and no CUDA boxing kernels.
      assert not (package_lib / "libtorch_cuda.so").is_file(), package_lib
      # The vendor 2.9.1 libtorch ABI must not be reachable from this venv.
      assert importlib.util.find_spec("torch_musa") is None, "torch_musa leaked into the venv"
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      assert torch_fl.flagos.device_count() > 0, torch_fl.flagos.device_count()
      print(f"CPU PyTorch: {torch.__version__}")
      print(f"torch path: {torch_path}")
      print(f"MUSA bundled libs: {package_lib}")
      print(f"flagos devices: {torch_fl.flagos.device_count()}")
      PY

  - id: operator-tests
    name: Run operator tests (vendor backend, main ops)
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/ops/
      -m "(anyplatform or main_ops) and not flaggems_python and not flaggems_cpp and not cuda and not ascend and not metax and not dcu and not gcu and not ppu"
      --tb=short

  - id: rng-tests
    name: Run unified RNG tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/ops/test_rng_dispatch.py
      -m "main_ops" --tb=short

  - id: general-tests
    name: Run general tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest
      tests/integration/test_factory_ops.py
      --tb=short

  - id: amp-contract
    name: Unified AMP contract
    phase: functional
    failure_policy: continue-after-failure
    command: python -m pytest tests/integration/test_amp_contract.py -m amp --tb=short

  # The profiler is a Required Contract with no per-platform capability table
  # (see profiler_support.py): it requires the full device/kernel/memcpy/memset
  # event set everywhere. MUSA's mupti tracer is documented under
  # docs/vendors/musa/installation.md. If it does not emit those events the
  # contract fails loudly and the observed categories land in
  # profiler-observations.json -- exactly the evidence an environment gap should
  # produce.
  - id: profiler-contract
    name: Unified profiler contract
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_profiler_contract.py
      -m profiler --tb=short

  # A real gate, not a skip. The CPU wheel ships no Triton, so a compile needs
  # the vendor flagtree wheel (flagtree-0.5.0+mthreads3.1) and the MThreads
  # backend. Until that stack is provisioned on this line the group fails, and
  # the failure is preserved as the environment-gap record.
  - id: compile-tests
    name: Run torch.compile tests
    phase: functional
    failure_policy: continue-after-failure
    command: python -m pytest tests/integration/test_compile.py --tb=short

  - id: inference-tests
    name: Run inference tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_qwen3_infer.py
      --model "$MODEL_PATH" --tb=short

  - id: training-tests
    name: Run training tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_qwen3_train.py
      --model "$MODEL_PATH" --tb=short

  # Platform-specific group, additive to the baseline above: asserts ops route to
  # the musa backend and match the CPU reference (it calls mudnn directly).
  - id: musa-dispatch
    name: Run MUSA dispatcher capability tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/ops/test_musa_dispatch.py
      -m musa --tb=short
