display_name: CUDA

# Platform-specific preparation is implemented outside the common workflows.
setup_script: .github/scripts/set_env.sh
setup_platform: nvidia

# Carries CUDA PyTorch, the FlagGems C++ operators, and an Ubuntu 24.04 userland
# recent enough for the FlagTree wheels the job installs (they bind GLIBC_2.38).
# Both CUDA entry points use it: the integration pipeline takes the digest from
# this file, and the manual Build Wheel path reaches it through the shared,
# vendor-agnostic workflows, which also need Python and git in the image.
# set_env_nvidia.sh checks the image glibc before installing FlagTree, so a future
# rebuild on an older userland fails naming the requirement.
ci_image: harbor.baai.ac.cn/flagos-dev/torch-fl:20261021-cuda-dev

runner_labels:
  - torch-fl-nv

# Platform-specific code selects this hardware lane on PRs.
# Shared or unrecognized code selects every lane conservatively.
paths_watch:
  - torch_fl/accelerator/nvidia/
  - torch_fl/configs/backends_nvidia.conf
  - csrc/aten/backends/nvidia/
  - csrc/runtime/accelerator/nvidia/
  - csrc/runtime/allocator/backends/nvidia_memory.h
  - .github/scripts/hooks/set_env_nvidia.sh
  - .github/scripts/set_env_nvidia.sh
  - scripts/vendor/with_nvidia_libtorch.sh

container_volumes:
  - /data/models/Qwen/Qwen3-0.6B:/models/Qwen3-0.6B:ro

integration_environment:
  MODEL_PATH: /models/Qwen3-0.6B

container_options: >-
  --gpus all
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
# Release/manual wheel-build artifact; CI tests the wheel in the build job.
wheel_artifact_name: wheel-cuda

# What this platform's environment has to look like before any test runs, read
# by the first step of .github/integration-manifest.yml through
# .github/scripts/check_platform_environment.py. The vocabulary is documented on
# that script; the values are this platform's, and they assert the same things
# the hand-written heredoc that used to sit here did.
#
# CUDA runs both builds of the wheel, one job each:
#
#   vendor lane (this file's `platform:` name)  the default wheel: FlagGems
#       routes compiled, boxing off, no bundled libtorch_cuda.so. Both halves of
#       that are asserted below from the build record rather than from an
#       environment variable, so the check describes the wheel that was built.
#
#   boxing lane (`nvidia-boxing`)  the same platform built with
#       FLAGOS_BUILD_BOXING=1: the generated CUDA boxing kernels plus the
#       libtorch_cuda.so they re-dispatch into, with FlagGems beside them. Its
#       expectations are `boxing_environment_check` below. Boxing is opt-in for
#       a user (FLAGOS_BUILD_BOXING=1 and FLAGOS_BACKEND_CONFIG pointing at
#       backends_nvidia_boxing.conf), and the lane measures exactly that opt-in.
#
# The Triton that compiles the FlagGems routes is the flagtree build the setup
# script installs, on both builds. Failing here names an image with the wrong
# Triton once, instead of ninety errors into the FlagGems group.
#
# `boxing_lane: true` is what schedules the second job
# (.github/scripts/ci/generate_matrix.py reads it); a platform without it, or
# without boxing, has one build.
boxing_lane: true

environment_check:
  torch_version_prefix: "2.10.0+cpu"
  cuda_version: null
  torch_path_forbidden:
    - /opt/conda/
  forbid_package_files:
    - lib/libtorch_cuda.so
  require_build_kernels:
    - flaggems
  forbid_build_kernels:
    - boxing
  flagtree:
    version_env: FLAGTREE_VERSION
    version_default: 0.7.0rc2
    triton_prefix: "3.6."
  model_dir: true

boxing_environment_check:
  torch_version_prefix: "2.10.0+cpu"
  cuda_version: null
  torch_path_forbidden:
    - /opt/conda/
  require_package_files:
    - lib/libtorch_cuda.so
  require_build_kernels:
    - flaggems
    - boxing
  flagtree:
    version_env: FLAGTREE_VERSION
    version_default: 0.7.0rc2
    triton_prefix: "3.6."
  model_dir: true
