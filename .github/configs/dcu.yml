display_name: Hygon DCU

# Platform-specific preparation is implemented outside the common workflows.
setup_script: .github/scripts/set_env_dcu.sh

# Pinned CI image: DTK base plus the /opt/torch-fl-dcu-venv Python environment
# used by set_env_dcu.sh. The script still falls back to creating a fresh venv
# when the prebuilt one is absent, but the CI image should avoid network installs.
ci_image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260816-dcu-ci

runner_labels:
  - hg-8g-cicd-pytorch

# Bind-mount the host hyhal driver into the container. libhydmi.so (Hygon DMI
# device management) and its sibling driver libs live here on the host, not in
# the flagos image; set_env_dcu.sh probes /usr/local/hyhal/lib and prepends it
# to LD_LIBRARY_PATH so flagos device init can dlopen libhydmi.so. Mount the
# real path /usr/local/hyhal (not the /opt/hyhal symlink) -- docker does not
# follow a symlink bind source. The runner host installs hyhal at the same
# standard layout as any DCU box, so the source path is portable across hosts.
container_volumes:
  - /usr/local/hyhal:/usr/local/hyhal:ro

integration_environment: {}

# DCU is non-NVIDIA: expose the /dev/kfd and /dev/dri device nodes through
# --privileged (mirrors the MetaX layout) instead of --gpus all.
container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
wheel_artifact_name: wheel-dcu
# Keep DCU integration self-contained; transferring the bundled libtorch wheel
# through the Actions artifact service can exceed the self-hosted runner job
# timeout.
integration_wheel_source: local-build

# The common workflow only executes this platform-provided test manifest.
# DCU is a boxing build (DTK torch is hipified, HIP kernels live under the CUDA
# dispatch key), so the vendor backend path and the FlagGems runtime path
# (backends_dcu.conf, DTK triton hcu + cuda boxing fallback) mirror
# CUDA's manifest. Inference/training are deferred until the runner has a model
# mount and the first CI run confirms the card count.
#
# FlagTree (the DTK triton build carrying the hcu backend) and FlagGems are
# provisioned by set_env_dcu.sh and enabled by default: the script installs both,
# exports FLAGOS_USE_FLAGGEMS=1 through $GITHUB_ENV, and refuses to continue if
# the hcu backend or the hygon vendor is not what the process actually resolved.
# No group below re-enables the path inline -- what runs here is what a stock DCU
# install gets.
integration_tests:
  - name: Check device availability
    command: |
      python - <<'PY'
      from pathlib import Path

      import torch_fl
      import torch

      torch_path = Path(torch.__file__).resolve()
      package_lib = Path(torch_fl.__file__).resolve().parent / "lib"

      assert torch.version.cuda is None, torch.version.cuda
      assert "/opt/conda/" not in str(torch_path), torch_path
      assert (package_lib / "libtorch_fl.so").is_file(), package_lib
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      assert torch_fl.flagos.device_count() > 0, torch_fl.flagos.device_count()
      print(f"CPU PyTorch: {torch.__version__}")
      print(f"torch path: {torch_path}")
      print(f"DCU assets: {package_lib}")
      print(f"flagos devices: {torch_fl.flagos.device_count()}")
      PY

  - name: Run operator tests (vendor backend, main ops)
    command: >-
      python -m pytest tests/integration/ops/
      -m "main_ops and not flaggems_python and not flaggems_cpp"
      -v -s --tb=short
  - name: Run operator tests (FlagGems runtime path, main ops)
    command: >-
      python -m pytest tests/integration/ops/
      -m "flaggems and main_ops" -v -s --tb=short
  - name: Run DCU low-precision matrix tests
    command: >-
      python -m pytest tests/integration/ops/test_soft_lowp_gate_dispatch.py
      -m "soft_lowp" -v -s --tb=short
  - name: Run unified RNG tests
    command: >-
      python -m pytest tests/integration/ops/test_rng_dispatch.py
      -m "main_ops" -v -s --tb=short
  - name: Run general tests
    command: python -m pytest tests/integration/test_factory_ops.py -v -s --tb=short
  - name: Unified AMP contract
    command: >-
      python -m pytest tests/integration/test_amp_contract.py
      -v -m amp --tb=short
  - name: Unified math-bits contract
    command: >-
      python -m pytest tests/integration/test_math_bits_contract.py
      -v -m math_bits --tb=short
  - name: Unified profiler contract
    command: >-
      python -m pytest tests/integration/test_profiler_contract.py
      -v -m profiler --tb=short

  # Structural comparison against tests/data/profiler_cuda_baseline.json, which
  # the shared contract does not cover: it asserts the public API surface, while
  # this checks tracer output against stock torch+cuda. Carried over from the
  # inline step this manifest replaces.
  - name: Profiler parity test
    command: >-
      python -m pytest tests/integration/test_profiler_parity.py
      -v -m main_ops --tb=short

  # Last on purpose. run_integration_tests.py returns as soon as one group
  # fails, so the order decides which signal a run produces: with the unit group
  # first, a repository-wide check that has nothing to do with DCU decides
  # whether any DCU hardware group runs at all. That is not hypothetical -- it
  # is what happened on run 34931465738 (job 104260457173), where
  # tests/unit/test_gen_vendor_confs.py stopped the run on the pre-existing
  # Ascend/GCU conf drift from #272 and the FlagGems group was never reached.
  # The device-dependent groups above are this platform's own measurement, so
  # they go first; this one reports its verdict at the end either way.
  #
  # One process per file: a unit test file here can take the whole interpreter
  # down -- an invalid device address is reported by the driver as a VMFault and
  # kills the process without unwinding -- and in a shared interpreter that costs
  # every result collected after it, including files that had already passed.
  #
  # UNIT_TESTS_ALLOW_TEARDOWN_CRASH covers containers whose RDMA stack faults
  # during exit(): libibverbs' ELF destructor calls into libnl-route-3's
  # rtnl_tc_unregister, so a run that already reported every test still ends in
  # a dying interpreter. Whether a given runner has it is a property of the
  # container image rather than of this project, so it stays opt-in here instead
  # of being assumed either way. The opt-in forgives a signal only after pytest
  # has printed a complete, clean summary; a signal before the summary is still
  # a failure.
  #
  # This is the one group that runs in the checkout rather than in the prepared
  # wheel-only workspace. tests/unit is a source-tree suite: it reads scripts/,
  # csrc/, .github/workflows/ and the rest of torch_fl/ relative to the
  # repository root, so running it from a directory holding only tests/ and
  # pyproject.toml fails seven files on FileNotFoundError before any assertion
  # runs -- and it cannot be fixed by copying those in, because a copied tree
  # stops describing the checkout it is supposed to guard. The checkout is
  # importable: the wheel build leaves torch_fl/_C.so and torch_fl/lib/*.so in
  # the tree, so the suite exercises the same build the wheel was cut from. The
  # integration groups above stay wheel-only on purpose.
  - name: Run unit tests (per file)
    command: >-
      cd "$GITHUB_WORKSPACE" &&
      UNIT_TESTS_ALLOW_TEARDOWN_CRASH=1
      python .github/scripts/run_unit_tests.py --timeout 300
