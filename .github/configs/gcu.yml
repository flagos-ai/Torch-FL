display_name: Enflame GCU

# GCU-specific environment preparation stays outside the common workflow.
setup_script: .github/scripts/set_env_gcu.sh

# Pinned TopsRider image used for the manual wheel validation. The setup script
# can install python3.12-venv when this base image is used directly; a derived
# CI image should bake it in (or provide TORCH_FL_PREBUILT_GCU_VENV) to avoid
# the apt fallback on every job.
ci_image: harbor.baai.ac.cn/flagtree/flagtree-enflame3.6-py312-torch2.10.0-ubuntu24.04@sha256:fadc6e46fa89dffacc6ebf6b85eb1b19b6098b16ae0ff25186aa83be4f93a718

runner_labels:
  - sy-8g-cicd-pytorch

container_volumes:
  - /data/models/Qwen/Qwen3-0.6B:/models/Qwen3-0.6B:ro

integration_environment:
  MODEL_PATH: /models/Qwen3-0.6B

container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
wheel_artifact_name: wheel-gcu

# TopsRider on a stock CPU Torch: the GCU runtime is reached through the vendor
# libraries, not a CUDA-variant Torch.
torch_contract:
  base_version: "2.10.0"
  cuda: none
  forbidden_torch_paths:
    - /usr/local/lib/python3.12/dist-packages

integration_tests:
  - id: model-availability
    name: Check model availability
    phase: preflight
    failure_policy: fail-fast
    command: |
      test -f "$MODEL_PATH/config.json" || { echo "::error::Missing config.json"; exit 1; }
      test -f "$MODEL_PATH/tokenizer_config.json" || { echo "::error::Missing tokenizer_config.json"; exit 1; }
      ls "$MODEL_PATH"/*.safetensors >/dev/null 2>&1 || ls "$MODEL_PATH"/*.bin >/dev/null 2>&1 || { echo "::error::Missing weight files"; exit 1; }

  - id: device-availability
    name: Check device availability
    phase: preflight
    failure_policy: fail-fast
    command: |
      python - <<'PY'
      from pathlib import Path

      import torch
      import torch_fl

      torch_path = Path(torch.__file__).resolve()
      package_root = Path(torch_fl.__file__).resolve().parent

      assert torch.version.cuda is None, torch.version.cuda
      assert "/usr/local/lib/python3.12/dist-packages" not in str(torch_path), torch_path
      assert not (package_root / "lib" / "libtorch_cuda.so").is_file(), package_root
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      count = torch_fl.flagos.device_count()
      assert count >= 8, f"expected at least 8 GCU devices, got {count}"

      print(f"CPU PyTorch: {torch.__version__}")
      print(f"torch path: {torch_path}")
      print(f"torch_fl path: {torch_fl.__file__}")
      print(f"GCU devices: {count}")
      PY

  # Marker selection, not a file allowlist: the earlier nine-file list was a
  # bring-up scaffold, and pinning an allowlist hides every operator added
  # after it. FlagGems is excluded because it needs the vendor Triton stack,
  # which this image does not install (the same exclusion CUDA/DCU apply to
  # their non-FlagGems step).
  - id: operator-tests
    name: Run operator tests (vendor backend, main ops)
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/ops/
      -m "(anyplatform or main_ops) and not flaggems_python and not flaggems_cpp and not cuda and not ascend and not musa and not metax and not dcu and not ppu"
      --tb=short

  # The whole RNG dispatch file, matching Ascend/CUDA/DCU/MetaX. The generator
  # contract, the shared-state round trip, and the integer range semantics are
  # implemented natively on GCU, so this is a contract check rather than a gap
  # detector.
  - id: rng-tests
    name: Run unified RNG tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/ops/test_rng_dispatch.py
      -m "main_ops" --tb=short

  - id: general-tests
    name: Run general tests
    phase: functional
    failure_policy: continue-after-failure
    command: python -m pytest tests/integration/test_factory_ops.py --tb=short

  # #160 measured the full AMP suite on S60 (25 passed): both autocast dtypes,
  # native unscale routes, `convolution_overrideable`, and the GradScaler
  # finite/overflow paths. float64 is stored natively and computed through the
  # CPU fallback, which the contract's float64 cases rely on.
  - id: amp-contract
    name: Unified AMP contract
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_amp_contract.py
      -m amp --tb=short

  # The TOPSPTI tracer does collect activities on S60 (229 for a three-iteration
  # matmul loop), but none reach the profiler as device events on a CPU-only
  # PyTorch/Kineto build, which supplies no PrivateUse1 resolver. The contract
  # runs and fails on that gap rather than being withheld, so the failure is the
  # record the platform owners act on.
  - id: profiler-contract
    name: Unified profiler contract
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_profiler_contract.py
      -m profiler --tb=short

  # torch.compile through triton_gcu. The GCU-marked tests are the regression
  # guards for four vendor-specific defects, two of which are silent: a
  # persistent reduction miscompiled at XBLOCK=1 (wrong values, and dim-0
  # reductions are mostly a backward shape, so it surfaces only as bad
  # gradients) and an FX cache key that failed to pickle, downgrading every
  # compile to a full recompile. Neither is visible from forward output alone,
  # so this step has to run the backward assertions to be worth anything.
  - id: compile-tests
    name: Run torch.compile tests
    phase: functional
    failure_policy: continue-after-failure
    command: python -m pytest tests/integration/test_compile.py --tb=short

  - id: inference-tests
    name: Run inference tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_qwen3_infer.py
      --model "$MODEL_PATH" --tb=short

  - id: training-tests
    name: Run training tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_qwen3_train.py
      --model "$MODEL_PATH" --tb=short
