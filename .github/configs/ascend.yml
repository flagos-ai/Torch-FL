display_name: Ascend

setup_script: .github/scripts/set_env.sh
setup_platform: ascend

# Ascend's hook prebuilds the native library in place and probes the device only
# when it is invoked as `build`; called as `integration` it skips both, and the
# wheel build then finds no library to link. Every other platform provisions at
# `integration`, so this is the one stage that is not the default.
setup_stage: build

# The official FlagTree Ascend image: CANN 9.0.0, Python 3.11, aarch64. It is the
# supported base for flagtree 0.7.0rc3+ascend3.5, whose wheel is cp311-only, and it
# already carries the FlagTree `triton`. set_env_ascend.sh is still self-contained
# -- it installs stock CPU torch + build deps into a fresh venv and re-pins
# flagtree/FlagGems from the FlagOS index -- so the image only has to supply
# python3.11 + CANN + a compiler. No vendor torch is baked in and torch_npu is
# explicitly forbidden.
ci_image: harbor.baai.ac.cn/flagtree/flagtree-ascend3.5-910c-py311-cann9.0.0-ubuntu22.04-aarch64:202608-torch2.10.0-vllm0.20.2

# Self-hosted Huawei (Ascend) runner registered by the teacher. The job is
# dispatched only to a runner carrying this label.
runner_labels:
  - flagcicd-910c

container_volumes: []

integration_environment: {}

container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE
  --device=/dev/davinci_manager
  --device=/dev/davinci0
  --device=/dev/davinci1
  --device=/dev/davinci2
  --device=/dev/davinci3
  --device=/dev/davinci4
  --device=/dev/davinci5
  --device=/dev/davinci6
  --device=/dev/davinci7
  --device=/dev/devmm_svm
  --device=/dev/hisi_hdc
  -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro

timeout_minutes: 120
# Release/manual wheel-build artifact; CI tests the wheel in the build job.
wheel_artifact_name: wheel-ascend

# What this platform's environment has to look like before any test runs, read
# by the first step of .github/integration-manifest.yml through
# .github/scripts/check_platform_environment.py. The vocabulary is documented on
# that script; the values are this platform's, and they assert the same things
# the hand-written heredoc that used to sit here did.
#
# Ascend is a pure ACLNN build: no CUDA dispatcher library ships in the wheel,
# and CANN exposes eight logical devices on the 910C runner.
environment_check:
  torch_version_prefix: "2.10.0+cpu"
  cuda_version: null
  torch_path_forbidden:
    - /opt/conda/
  forbid_package_files:
    - lib/libtorch_cuda.so
  flagos_devices:
    at_least: 8
