display_name: Ascend

setup_script: .github/scripts/set_env_ascend.sh

# The CI image is the canonical CANN 9.0.0 aarch64 base (the same one used for
# hand-staged acceptance), retagged into the BAAI harbor flagos-dev project.
# set_env_ascend.sh is self-contained: it installs standard CPU torch + build
# deps into a fresh venv, so the image only needs python3.12 + CANN + a compiler
# -- no vendor torch is baked in (torch_npu is explicitly forbidden).
ci_image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260816-ascend-ci

# Self-hosted Huawei (Ascend) runner registered by the teacher. The job is
# dispatched only to a runner carrying this label.
runner_labels:
  - flagcicd-910c

container_volumes:
  - /data/models/Qwen/Qwen3-0.6B:/models/Qwen3-0.6B:ro

integration_environment:
  MODEL_PATH: /models/Qwen3-0.6B

container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE
  --device=/dev/davinci_manager
  --device=/dev/davinci0
  --device=/dev/davinci1
  --device=/dev/davinci2
  --device=/dev/davinci3
  --device=/dev/davinci4
  --device=/dev/davinci5
  --device=/dev/davinci6
  --device=/dev/davinci7
  --device=/dev/devmm_svm
  --device=/dev/hisi_hdc
  -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro

timeout_minutes: 60
wheel_artifact_name: wheel-ascend

# Pure ACLNN backend on a stock CPU Torch: no CUDA runtime and no vendor Torch
# (torch_npu is explicitly forbidden), so the CUDA variant must stay None.
torch_contract:
  base_version: "2.10.0"
  local_version: cpu
  cuda: none
  forbidden_torch_paths:
    - /opt/conda/

integration_tests:
  - id: model-availability
    name: Check model availability
    phase: preflight
    failure_policy: fail-fast
    command: |
      test -f "$MODEL_PATH/config.json" || { echo "::error::Missing config.json"; exit 1; }
      test -f "$MODEL_PATH/tokenizer_config.json" || { echo "::error::Missing tokenizer_config.json"; exit 1; }
      ls "$MODEL_PATH"/*.safetensors >/dev/null 2>&1 || ls "$MODEL_PATH"/*.bin >/dev/null 2>&1 || { echo "::error::Missing weight files"; exit 1; }

  - id: device-availability
    name: Check device availability
    phase: preflight
    failure_policy: fail-fast
    command: |
      python - <<'PY'
      from pathlib import Path

      import torch_fl
      import torch

      torch_path = Path(torch.__file__).resolve()
      package_lib = Path(torch_fl.__file__).resolve().parent / "lib"

      assert torch.version.cuda is None, torch.version.cuda
      assert "/opt/conda/" not in str(torch_path), torch_path
      # Ascend has no CUDA assets; the CUDA dispatcher library must NOT ship.
      assert not (package_lib / "libtorch_cuda.so").is_file(), package_lib
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      n = torch_fl.flagos.device_count()
      assert n >= 8, f"expected at least 8 Ascend logical devices, got {n}"
      print(f"CPU PyTorch: {torch.__version__}")
      print(f"torch path: {torch_path}")
      print(f"flagos logical devices: {n}")
      PY

  # The tests authored for the pure ACLNN backend carry the `ascend` marker.
  - id: operator-tests
    name: Run operator tests (vendor backend)
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/ops/
      -m "ascend"
      --tb=short

  # The full RNG dispatch suite is exercised, not an allowlist. Upstream #70
  # implemented the remaining Ascend RNG overloads (normal_ / uniform_ /
  # exponential_ / bernoulli_ / randperm / native_dropout / *_like / *.out
  # variants, plus poisson / binomial / _standard_gamma / _sample_dirichlet via
  # CPU round-trip), so every test_rng_dispatch.py case now passes on Ascend.
  - id: rng-tests
    name: Run unified RNG tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/ops/test_rng_dispatch.py
      -m "main_ops"
      --tb=short

  - id: general-tests
    name: Run general tests
    phase: functional
    failure_policy: continue-after-failure
    command: python -m pytest tests/integration/test_factory_ops.py --tb=short

  - id: amp-contract
    name: Unified AMP contract
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_amp_contract.py
      -m amp --tb=short

  # The Ascend tracer currently exposes CPU/Trace records only, so the
  # device-side cases of this contract fail. That failure is the record of the
  # gap and belongs to the Ascend profiler owners; it is not skipped here.
  - id: profiler-contract
    name: Unified profiler contract
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_profiler_contract.py
      -m profiler --tb=short

  # torch.compile through triton-ascend (upstream #189). The vendor Triton is
  # installed by set_env_ascend.sh; a generic PyPI triton is not a substitute and
  # is never installed in its place.
  - id: compile-tests
    name: Run torch.compile tests
    phase: functional
    failure_policy: continue-after-failure
    command: python -m pytest tests/integration/test_compile.py --tb=short

  - id: inference-tests
    name: Run inference tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_qwen3_infer.py
      --model "$MODEL_PATH" --tb=short

  - id: training-tests
    name: Run training tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_qwen3_train.py
      --model "$MODEL_PATH" --tb=short
