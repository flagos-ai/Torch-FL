display_name: Ascend

setup_script: .github/scripts/set_env_ascend.sh

# The CI image is the canonical CANN 9.0.0 aarch64 base (the same one used for
# hand-staged acceptance), retagged into the BAAI harbor flagos-dev project.
# set_env_ascend.sh is self-contained: it installs standard CPU torch + build
# deps into a fresh venv, so the image only needs python3.12 + CANN + a compiler
# -- no vendor torch is baked in (torch_npu is explicitly forbidden).
ci_image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260816-ascend-ci

# Self-hosted Huawei (Ascend) runner registered by the teacher. The job is
# dispatched only to a runner carrying this label.
runner_labels:
  - flagcicd-910c

container_volumes: []

integration_environment: {}

container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE
  --device=/dev/davinci_manager
  --device=/dev/davinci0
  --device=/dev/davinci1
  --device=/dev/davinci2
  --device=/dev/davinci3
  --device=/dev/davinci4
  --device=/dev/davinci5
  --device=/dev/davinci6
  --device=/dev/davinci7
  --device=/dev/devmm_svm
  --device=/dev/hisi_hdc
  -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro

timeout_minutes: 60
wheel_artifact_name: wheel-ascend
# Ascend does not bundle a vendor libtorch, so its wheel is small enough to pass
# through Actions artifacts. Test the exact wheel produced by the build job.
integration_wheel_source: artifact

integration_tests:
  - name: Check device availability
    command: |
      python - <<'PY'
      from pathlib import Path

      import torch_fl
      import torch

      torch_path = Path(torch.__file__).resolve()
      package_lib = Path(torch_fl.__file__).resolve().parent / "lib"

      assert torch.__version__.startswith("2.10.0+cpu"), torch.__version__
      assert torch.version.cuda is None, torch.version.cuda
      assert "/opt/conda/" not in str(torch_path), torch_path
      # Ascend has no CUDA assets; the CUDA dispatcher library must NOT ship.
      assert not (package_lib / "libtorch_cuda.so").is_file(), package_lib
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      n = torch_fl.flagos.device_count()
      assert n >= 8, f"expected at least 8 Ascend logical devices, got {n}"
      print(f"CPU PyTorch: {torch.__version__}")
      print(f"torch path: {torch_path}")
      print(f"flagos logical devices: {n}")
      PY

  # Exercise the tests authored for the pure ACLNN backend (marked `ascend`),
  # kept separate from the RNG dispatch suite which carries the `main_ops`
  # marker and is driven by its own step below.
  - name: Run Ascend backend operator tests
    command: >-
      python -m pytest tests/integration/ops/
      -m "ascend"
      -v -s --tb=short

  # The full RNG dispatch suite is exercised, not an allowlist. Upstream #70
  # implemented the remaining Ascend RNG overloads (normal_ / uniform_ /
  # exponential_ / bernoulli_ / randperm / native_dropout / *_like / *.out
  # variants, plus poisson / binomial / _standard_gamma / _sample_dirichlet via
  # CPU round-trip), so every test_rng_dispatch.py case now passes on Ascend.
  # Run the whole file instead of pinning a shrinking allowlist.
  - name: Run Ascend RNG tests
    command: >-
      python -m pytest tests/integration/ops/test_rng_dispatch.py
      -m "main_ops"
      -v -s --tb=short

  - name: Run general factory ops
    command: python -m pytest tests/integration/test_factory_ops.py -v -s --tb=short

  - name: Unified AMP contract
    command: >-
      python -m pytest tests/integration/test_amp_contract.py
      -v -m amp --tb=short

  - name: Unified math-bits contract
    command: >-
      python -m pytest tests/integration/test_math_bits_contract.py
      -v -m math_bits --tb=short

  # Byte-identical to every other platform's profiler step. Ascend's extra
  # prerequisite -- the process-start libmspti.so that CANN 9.0 needs for
  # aclrtMemcpy*/aclrtMemset* interposition, which a later dlopen cannot supply
  # -- is established by set_env_ascend.sh alongside every other Ascend
  # environment prerequisite, so no vendor detail leaks into the test command.
  # See docs/architecture/profiler.md.
  - name: Unified profiler contract
    command: >-
      python -m pytest tests/integration/test_profiler_contract.py
      -v -m profiler --tb=short

  # Device-only contract cases skip through profiler capabilities while the
  # Ascend tracer exposes CPU/Trace records only. CPU/API coverage still runs.
  # Memset stays off even with MSPTI loaded: torch.zeros() -- the only zeroing
  # op reachable from the shared profile_result() workload -- routes through the
  # aclnnInplaceZero kernel, not the allocator's aclrtMemset calls, because that
  # kernel was measured far faster (12.7us vs 133us at 1 MiB on 910). The
  # missing gpu_memset record is a consequence of that routing choice.
  # ---------------------------------------------------------------------------
  # Follow-up (not part of first-version acceptance). Tracked here so the
  # upstream gaps not yet covered by CI are not lost:
  #   - Qwen3 inference/training smoke once a model is mounted on the Ascend
  #     runner (deferred; not required for the first-version op contract).
  # ---------------------------------------------------------------------------
