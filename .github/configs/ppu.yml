display_name: PPU

setup_script: .github/scripts/set_env_ppu.sh

ci_image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260811-ppu-dev

runner_labels:
  - flagcicd-810e

container_volumes:
  # PPU_SDK (underscore, /usr/local/PPU_SDK) is baked into the image with
  # CUDA_SDK/lib64/libcudart.so; no host mount needed. FlagGems source is not
  # in the image (find returns nothing); the runner pod mounts the shared CPFS
  # PV at /workspace/FlagGems, and docker create -v bind-mounts it through to
  # the job container (verified: ls lists the source tree). set_env then
  # synthesizes a .pth so venv python can import flag_gems from this path.
  - /workspace/FlagGems:/workspace/FlagGems:ro
  - /data/models/Qwen/Qwen3-0.6B:/models/Qwen3-0.6B:ro

integration_environment:
  MODEL_PATH: /models/Qwen3-0.6B

# DSW authZ plugin denies --privileged / --ipc=host / --security-opt /
# --cap-add (Aliyun DSW docs: "authorization denied by plugin authZ"). Mount
# the AliXPU device nodes explicitly with --device instead (authZ allows it).
# Three node classes: /dev/alixpu (base), /dev/alixpu_ctl (control),
# /dev/alixpu_ppu0-15 (compute, 16 on the probed pod -- adjust if the runner
# exposes a different count). Multi-card NCCL uses --shm-size shared memory,
# not SysV IPC, so --ipc=host is not needed. GitHub Actions container.options
# passes these verbatim to docker create, so the list must be static (no shell
# $(ls ...) expansion).
container_options: >-
  --shm-size=4g
  --device=/dev/alixpu
  --device=/dev/alixpu_ctl
  --device=/dev/alixpu_ppu0
  --device=/dev/alixpu_ppu1
  --device=/dev/alixpu_ppu2
  --device=/dev/alixpu_ppu3
  --device=/dev/alixpu_ppu4
  --device=/dev/alixpu_ppu5
  --device=/dev/alixpu_ppu6
  --device=/dev/alixpu_ppu7
  --device=/dev/alixpu_ppu8
  --device=/dev/alixpu_ppu9
  --device=/dev/alixpu_ppu10
  --device=/dev/alixpu_ppu11
  --device=/dev/alixpu_ppu12
  --device=/dev/alixpu_ppu13
  --device=/dev/alixpu_ppu14
  --device=/dev/alixpu_ppu15

timeout_minutes: 60
wheel_artifact_name: wheel-ppu
# Keep PPU integration self-contained; the bundled lib_ppu wheel is large and
# transferring it through the Actions artifact service can exceed the
# self-hosted runner job timeout.
integration_wheel_source: local-build

# The common workflow only executes this platform-provided test manifest.
integration_tests:
  - name: Check model availability
    command: test -d "$MODEL_PATH"

  # PPU is a CUDA-ABI boxing backend, so the CUDA dispatch key carries vendor
  # kernels and torch.cuda.is_available() reflects the real PPU devices.
  # Pod probe found 16 /dev/alixcu_ppu nodes; CI runner device count may
  # differ. Adjust the literal after the first green run.
  - name: Check device availability
    command: |
      python - <<'PY'
      from pathlib import Path

      import torch_fl
      import torch

      torch_fl_path = Path(torch_fl.__file__).resolve()
      torch_path = Path(torch.__file__).resolve()
      ppu_bundle = torch_fl_path.parent / "lib_ppu"

      # PPU runs in an isolated venv with stock +cpu torch (the link target).
      # Core replacement swaps the .so only, not torch/version.py, so
      # __version__ / version.cuda still read as stock +cpu / None -- same as
      # the cuda line. The PPU-takeover signal is torch.cuda.is_available() +
      # device_count(): the PPU libtorch_cuda.so is bundled in lib_ppu/ (not
      # torch_fl/lib/ like the cuda line's external asset) and loaded at import
      # via ensure_ppu_libtorch_links + _preload_global.
      assert torch.__version__.startswith("2.10.0+cpu"), torch.__version__
      assert torch.version.cuda is None, torch.version.cuda
      assert "/opt/conda/" not in str(torch_path), torch_path
      assert (ppu_bundle / "libtorch_cuda.so").is_file(), ppu_bundle
      assert torch.cuda.is_available(), "PPU devices are unavailable"
      assert torch.cuda.device_count() > 0, torch.cuda.device_count()
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      assert torch_fl.flagos.device_count() > 0, torch_fl.flagos.device_count()

      print(f"PyTorch: {torch.__version__}")
      print(f"torch: {torch_path}")
      print(f"torch_fl: {torch_fl_path}")
      print(f"PPU bundle: {ppu_bundle}")
      print(f"PPU devices: {torch.cuda.device_count()}")
      print(f"flagos devices: {torch_fl.flagos.device_count()}")
      PY

  - name: Run operator tests (vendor backend, main ops)
    command: >-
      python -m pytest tests/integration/ops/
      -m "main_ops and not flaggems_python and not flaggems_cpp"
      -v -s --tb=short

  # PPU triton (vendor build copied into the venv) does not recognise the
  # `num_ldmatrixes` keyword that FlagGems' _hygon mm/bmm kernel passes to
  # triton's mm_kernel -- KeyError at triton/runtime/jit.py:_pack_args (mm),
  # and bmm hits the same kernel and times out at 60s inside triton
  # compilation. The remaining 13 flaggems main_ops pass. Follow-up: track PPU
  # triton alignment with upstream FlagGems _hygon mm op. No CPU fallback.
  - name: Run operator tests (FlagGems runtime path, main ops)
    command: >-
      if [[ -z "${FLAGGEMS_SOURCE:-}" ]]; then
        echo "FlagGems source is unavailable; skipping optional FlagGems runtime tests"
        exit 0
      fi
      FLAGOS_USE_FLAGGEMS=1
      python -m pytest tests/integration/ops/
      -m "flaggems and main_ops"
      --deselect tests/integration/ops/test_bmm_dispatch.py::TestBmmDispatchLog::test_dispatch_log_flaggems_runtime
      --deselect tests/integration/ops/test_mm_dispatch.py::TestMmDispatchLog::test_dispatch_log_flaggems_runtime
      -v -s --tb=short

  - name: Run general tests
    command: python -m pytest tests/integration/test_factory_ops.py -v -s --tb=short

  - name: Unified math-bits contract
    command: >-
      python -m pytest tests/integration/test_math_bits_contract.py
      -v -m math_bits --tb=short

  # ---------------------------------------------------------------------------
  # Follow-up (not part of first-version acceptance). PPU CUPTI Activity API is
  # defective: CuptiActivityApi.cpp:298 logs "bufferCompleted called with
  # unknown buffer", so torch.profiler collects no device-side events. The
  # flagos trace has only ['Trace','cpu_op'] vs the torch-cuda baseline
  # ['Trace','cpu_op','cuda_runtime','gpu_memcpy','gpu_memset','kernel'].
  # test_profiler_parity.py (7 tests) all fail on the missing categories, so
  # the step is excluded from first-version CI. Re-add once the PPU CUPTI
  # Activity path emits the expected device/runtime categories.
  # This may not be unblocked by a CPU fallback or faking a pass.
  # ---------------------------------------------------------------------------
  - name: Run inference tests
    command: >-
      python -m pytest tests/integration/test_qwen3_infer.py
      --model "$MODEL_PATH" -v -s --tb=short

  - name: Run training tests
    command: >-
      python -m pytest tests/integration/test_qwen3_train.py
      --model "$MODEL_PATH" -v -s --tb=short
