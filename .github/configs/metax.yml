display_name: MetaX

setup_script: .github/scripts/set_env_metax.sh

ci_image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260731-metax-dev

runner_labels:
  - mx-8g-cicd-pytorch

container_volumes:
  - /data/models/Qwen/Qwen3-0.6B:/models/Qwen3-0.6B:ro

integration_environment:
  MODEL_PATH: /models/Qwen3-0.6B

container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
wheel_artifact_name: wheel-metax

# MetaX shims the CUDA runtime (cu-bridge) under a stock CPU Torch, so
# torch.cuda.is_available() is true while torch.version.cuda stays None.
torch_contract:
  base_version: "2.10.0"
  local_version: cpu
  cuda: none
  forbidden_torch_paths:
    - /opt/conda/

integration_tests:
  - id: model-availability
    name: Check model availability
    phase: preflight
    failure_policy: fail-fast
    command: |
      test -f "$MODEL_PATH/config.json" || { echo "::error::Missing config.json"; exit 1; }
      test -f "$MODEL_PATH/tokenizer_config.json" || { echo "::error::Missing tokenizer_config.json"; exit 1; }
      ls "$MODEL_PATH"/*.safetensors >/dev/null 2>&1 || ls "$MODEL_PATH"/*.bin >/dev/null 2>&1 || { echo "::error::Missing weight files"; exit 1; }

  - id: device-availability
    name: Check device availability
    phase: preflight
    failure_policy: fail-fast
    command: |
      python - <<'PY'
      from pathlib import Path

      import torch_fl
      import torch

      torch_fl_path = Path(torch_fl.__file__).resolve()
      torch_path = Path(torch.__file__).resolve()

      # MetaX shims the CUDA runtime through cu-bridge, so the CUDA dispatch key
      # carries vendor kernels and torch.cuda reflects the real MetaX devices
      # while the Torch build itself stays CPU (version.cuda is None).
      assert torch.version.cuda is None, torch.version.cuda
      assert str(torch_path).startswith("/opt/venv/"), torch_path
      assert "/opt/conda/" not in str(torch_path), torch_path
      assert torch.cuda.is_available(), "MetaX devices are unavailable"
      assert torch.cuda.device_count() == 8, torch.cuda.device_count()
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      assert torch_fl.flagos.device_count() == 8, torch_fl.flagos.device_count()

      print(f"PyTorch: {torch.__version__}")
      print(f"torch: {torch_path}")
      print(f"torch_fl: {torch_fl_path}")
      print(f"MetaX devices: {torch.cuda.device_count()}")
      print(f"flagos devices: {torch_fl.flagos.device_count()}")
      PY

  # Marker selection over the whole ops directory. The earlier sixteen-file
  # allowlist was a bring-up scaffold: it hid every operator added after it was
  # written, and --maxfail=1 stopped the run at the first failure so the rest of
  # the operator surface went unmeasured. FlagGems markers stay excluded because
  # this image does not install the vendor Triton stack.
  - id: operator-tests
    name: Run operator tests (vendor backend, main ops)
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/ops/
      -m "(anyplatform or main_ops) and not flaggems and not flaggems_python and not flaggems_cpp and not cuda and not ascend and not musa and not dcu and not gcu and not ppu"
      --tb=short

  - id: rng-tests
    name: Run unified RNG tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/ops/test_rng_dispatch.py
      -m "main_ops" --tb=short

  - id: general-tests
    name: Run general tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest
      tests/integration/test_factory_ops.py
      --tb=short

  - id: amp-contract
    name: Unified AMP contract
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_amp_contract.py
      -m amp --tb=short

  - id: profiler-contract
    name: Unified profiler contract
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_profiler_contract.py
      -m profiler --tb=short

  - id: compile-tests
    name: Run torch.compile tests
    phase: functional
    failure_policy: continue-after-failure
    command: python -m pytest tests/integration/test_compile.py --tb=short

  - id: inference-tests
    name: Run inference tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_qwen3_infer.py
      --model "$MODEL_PATH" --tb=short

  - id: training-tests
    name: Run training tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_qwen3_train.py
      --model "$MODEL_PATH" --tb=short
