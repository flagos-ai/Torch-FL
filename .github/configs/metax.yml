display_name: MetaX

setup_script: .github/scripts/set_env.sh
setup_platform: metax

ci_image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260731-metax-dev

runner_labels:
  - mx-8g-cicd-pytorch

# Platform-specific code selects this hardware lane on PRs.
# Shared or unrecognized code selects every lane conservatively.
paths_watch:
  - torch_fl/accelerator/metax/
  - torch_fl/configs/backends_metax.conf
  - csrc/aten/backends/metax/
  - csrc/runtime/accelerator/metax/
  - csrc/runtime/allocator/backends/nvidia_memory.h
  - .github/scripts/hooks/set_env_metax.sh
  - .github/scripts/set_env_metax.sh
  - scripts/vendor/bundle_metax_libtorch.sh

container_volumes: []

# Issue #253. The MetaX image exports TORCH_ALLOW_TF32_CUBLAS_OVERRIDE=1, which
# ATen reads while it initialises its TF32 state, so
# torch.backends.cuda.matmul.allow_tf32 is already True before user code runs
# and MACA's GEMM takes its TF32 kernel for an fp32 mm/bmm. That is the
# documented meaning of the variable and MACA honors it -- the kernel is not the
# defect -- but it makes every numeric assertion in this job a TF32 assertion:
# measured on the C550, an fp32 64x128 @ 128x32 mm lands 1.5e-02 from an fp64
# reference with the variable set and 1.3e-05 without.
#
# "0" is the explicit-off spelling, and it is what overrides an inherited 1. A
# non-numeric value such as "false" or an empty string raises a UserWarning and
# is treated as off, so both are load-bearing spellings and neither is used
# here; unset and 0 are numerically identical but unset cannot cancel the
# image's value.
#
# This is the environment, not set_env_metax.sh, because the setup script runs
# as its own step: each step gets a fresh shell, so an unset inside the script
# reaches nothing, and $GITHUB_ENV would only be a second copy of this line.
# Nothing in the build reads the flag. tests/integration/test_dtype_coverage.py
# pins the resulting precision, so a dropped pin fails a test -- and fails it on
# the step below that names test_dtype_coverage.py -- rather than passing
# silently.
integration_environment:
  TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: "0"

container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
# Release/manual wheel-build artifact; CI tests the wheel in the build job.
wheel_artifact_name: wheel-metax

# What this platform's environment has to look like before any test runs, read
# by the first step of .github/integration-manifest.yml through
# .github/scripts/check_platform_environment.py. The vocabulary is documented on
# that script; the values are this platform's.
#
# MetaX runs both builds of the wheel, one job each:
#
#   vendor lane (this file's `platform:` name)  a MetaX build with boxing off:
#       the FlagGems routes the conf names, no generated boxing kernels, no
#       cu-bridge shim. setup.py records the kernel sets in
#       torch_fl/_build_config.py and the runtime derives its conf from that
#       record, so the assertions below are about the wheel, not the env.
#
#   boxing lane (`metax-boxing`)  FLAGOS_BUILD_BOXING=1 with the cu-bridge
#       shim and the MXVM runtime, run against the day-0 conf
#       backends_metax_boxing.conf -- what a user's boxing opt-in selects
#       (AGENTS.md, "Day-0 boxing confs").
#
# `boxing_lane: true` is what schedules the second job
# (.github/scripts/ci/generate_matrix.py reads it).
boxing_lane: true

environment_check:
  torch_version_prefix: "2.10.0+cpu"
  torch_path_prefix: /opt/venv/
  torch_path_forbidden:
    - /opt/conda/
  flagos_devices:
    exactly: 8
  cuda_available: true
  cuda_devices:
    exactly: 8
  triton_backend: metax
  require_imports:
    - flag_gems
  require_build_kernels:
    - flaggems
  forbid_build_kernels:
    - boxing

boxing_environment_check:
  torch_version_prefix: "2.10.0+cpu"
  torch_path_prefix: /opt/venv/
  torch_path_forbidden:
    - /opt/conda/
  flagos_devices:
    exactly: 8
  cuda_available: true
  cuda_devices:
    exactly: 8
  triton_backend: metax
  require_imports:
    - flag_gems
  # A boxing build that lost the switch would fail here as a named kernel set
  # instead of as `empty_like: routed to 'none'` halfway through the portable
  # group.
  require_build_kernels:
    - flaggems
    - boxing
