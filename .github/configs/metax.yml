display_name: MetaX

setup_script: .github/scripts/set_env_metax.sh

ci_image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260731-metax-dev

runner_labels:
  - mx-8g-cicd-pytorch

container_volumes: []

integration_environment: {}

container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
wheel_artifact_name: wheel-metax
# Keep MetaX integration self-contained; transferring the ~670MB wheel through
# the Actions artifact service can exceed the self-hosted runner job timeout.
integration_wheel_source: local-build

integration_tests:
  - name: Diagnose bundled MetaX ELF symbols (temporary)
    command: |
      python - <<'PY'
      from pathlib import Path
      import sysconfig

      package_root = Path(sysconfig.get_paths()["purelib"]) / "torch_fl"
      symbol = "_ZN2at6native6flagos29GetFlagosDefaultCudaGeneratorEl"
      libraries = [package_root / "lib" / "libtorch_fl.so"]
      libraries.extend(sorted((package_root / "lib_maca").glob("*.so*")))

      print(f"package_root={package_root}")
      print(f"symbol={symbol}")
      for library in libraries:
          print(f"--- {library}")
          print(f"exists={library.is_file()}")
      PY
      SYM='_ZN2at6native6flagos29GetFlagosDefaultCudaGeneratorEl'
      ROOT="$(python -c 'import sysconfig; from pathlib import Path; print(Path(sysconfig.get_paths()["purelib"]) / "torch_fl")')"
      for lib in "$ROOT/lib/libtorch_fl.so" "$ROOT"/lib_maca/*.so*; do
        [[ -f "$lib" ]] || continue
        echo "--- $lib"
        nm -D --defined-only "$lib" 2>/dev/null | grep "$SYM" || true
      done
      for lib in "$ROOT/lib"/libflagos.so* "$ROOT/lib"/libtorch_bindings.so* \
                 /opt/maca/lib/*.so* /opt/maca/tools/cu-bridge/lib/*.so*; do
        [[ -f "$lib" ]] || continue
        nm -D --defined-only "$lib" 2>/dev/null | grep "$SYM" && echo "provider=$lib" || true
      done
      readelf -d "$ROOT/lib/libtorch_fl.so" | grep 'NEEDED\|RPATH\|RUNPATH' || true

  - name: Check isolated MetaX environment
    command: |
      python - <<'PY'
      from pathlib import Path

      import torch_fl
      import torch

      torch_fl_path = Path(torch_fl.__file__).resolve()
      torch_path = Path(torch.__file__).resolve()

      assert torch.__version__.startswith("2.10.0+cpu"), torch.__version__
      assert str(torch_path).startswith("/opt/venv/"), torch_path
      assert "/opt/conda/" not in str(torch_path), torch_path
      assert torch.cuda.is_available(), "MetaX devices are unavailable"
      assert torch.cuda.device_count() == 8, torch.cuda.device_count()
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      assert torch_fl.flagos.device_count() == 8, torch_fl.flagos.device_count()

      # The FlagGems group below cannot run without both halves: the generated
      # kernels call `flag_gems.<name>` on the package-level namespace, and the
      # Triton that compiles them has to be the vendor one carrying the `metax`
      # backend. Failing here names the gap once instead of as 90 errors.
      import triton
      import flag_gems

      assert "metax" in triton.backends.backends, sorted(triton.backends.backends)

      print(f"PyTorch: {torch.__version__}")
      print(f"torch: {torch_path}")
      print(f"torch_fl: {torch_fl_path}")
      print(f"Triton: {triton.__version__} ({triton.__file__})")
      print(f"FlagGems: {flag_gems.__version__} ({flag_gems.__file__})")
      print(f"MetaX devices: {torch.cuda.device_count()}")
      print(f"flagos devices: {torch_fl.flagos.device_count()}")
      PY

  # Marker selection, not a file allowlist: the generic per-op dispatch files
  # carry @pytest.mark.main_ops, and the platform gate (tests/integration/ops/
  # conftest.py) already skips the cuda/metax/ascend/dcu-marked cases for a MetaX
  # boxing build, so the remaining failures are real. The FlagGems-marked cases
  # are excluded here and measured by the dedicated group below.
  #
  # Measured on the eight-device C550 host on 2026-09-15: 113 passed, 28 skipped,
  # 1059 deselected, 1 xpassed.
  - name: Run operator tests (cuda boxing backend, main ops)
    command: >-
      python -m pytest tests/integration/ops/
      -m "main_ops and not flaggems_python and not flaggems_cpp"
      -v -s --tb=short

  # FLAGOS_USE_FLAGGEMS is set on this command line and deliberately nowhere else.
  # It selects no conf on any platform any more -- routing is a property of the
  # build (torch_fl/__init__.py:_select_backend_config) -- but it is still the
  # gate tests/integration/ops/conftest.py:_flaggems_enabled reads, so without it
  # every @pytest.mark.flaggems case records a skip instead of a result. The group
  # above excludes those cases for exactly that reason; this is where they are
  # measured, and the variable is scoped to this command so the rest of the suite
  # does not turn into a second measurement of the switch.
  #
  # Each case asserts that a FlagGems-marked op dispatches to whatever the conf
  # routes it to, through tests/integration/ops/backend_conf.py:routed_backend --
  # never a hard-coded backend name, which would describe whichever platform the
  # test was written on. That makes this group a routing measurement, not a
  # FlagGems-only one: of the 13 cases, four are routed to the FlagGems Python
  # path (abs, neg, silu, where.self), two to its C++ path (embedding, _softmax)
  # and seven to the cuda boxing kernel (add.Tensor, bmm, cat, mean.dim, mm,
  # mul.Tensor, sum.dim_IntList) because backends_metax.conf holds the
  # triton-metax gaps off FlagGems. The C++ pair is also where the two
  # vocabularies show: the conf spells that path `flaggems_cpp` and the dispatch
  # log prints `flagos`.
  #
  # Measured on the eight-device C550 host on 2026-09-15: 13 passed, 1206
  # deselected, 1 xpassed in 251s.
  - name: Run operator tests (FlagGems runtime path, main ops)
    command: >-
      FLAGOS_USE_FLAGGEMS=1
      python -m pytest tests/integration/ops/
      -m "flaggems and main_ops" -v -s --tb=short

  # The MetaX counterpart of test_musa_dispatch.py. backends_metax.conf is
  # FlagGems-first -- 592 of its 2036 ops go to the FlagGems Python path, 12 to
  # its C++ path, and the rest fall back to the cuda boxing kernel -- and this
  # file pins that decision on hardware: routing is read from the dispatch log in
  # a fresh subprocess (PythonOpCache memoizes the resolved FlagGems callable per
  # qualname, so an in-session patch is not observable), execution is compared
  # against a host-built CPU reference, and the ops measured to fail on a flagos
  # tensor are held off the FlagGems path.
  #
  # It is marked flaggems_python rather than flaggems on purpose: the FlagGems
  # route on MetaX is a property of the conf, not of a FLAGOS_USE_FLAGGEMS runtime
  # switch (that variable no longer selects a conf on any platform), so this file
  # is not gated by the switch and runs in every job. The @pytest.mark.flaggems
  # cohort the switch does gate is measured by the group above.
  #
  # Measured on the eight-device C550 host on 2026-09-15: 90 passed in 756s.
  - name: Run MetaX FlagGems hybrid path tests
    command: >-
      python -m pytest tests/integration/ops/test_metax_flaggems.py
      -v -s --tb=short

  # Measured on the eight-device C550 host on 2026-09-15: 30 passed, 7 deselected.
  - name: Run MetaX low-precision matrix tests
    command: >-
      python -m pytest tests/integration/ops/test_soft_lowp_gate_dispatch.py
      -m "soft_lowp" -v -s --tb=short

  # Measured on the eight-device C550 host on 2026-09-15: 113 passed, 2 skipped,
  # 1 deselected, 1 xpassed.
  - name: Run unified RNG tests
    command: >-
      python -m pytest tests/integration/ops/test_rng_dispatch.py
      -m "main_ops" -v -s --tb=short

  # Measured on the eight-device C550 host on 2026-09-15: 46 passed.
  - name: Run general factory and autograd tests
    command: >-
      python -m pytest
      tests/integration/test_factory_ops.py
      -v -s --tb=short

  # Measured on the eight-device C550 host on 2026-09-15: 27 passed.
  - name: Unified AMP contract
    command: >-
      python -m pytest tests/integration/test_amp_contract.py
      -v -m amp --tb=short

  # Measured on the eight-device C550 host on 2026-09-15: 12 passed.
  - name: Unified math-bits contract
    command: >-
      python -m pytest tests/integration/test_math_bits_contract.py
      -v -m math_bits --tb=short

  # All 12 cases skip on MetaX: the suite's platform table gates them on
  # "MetaX profiler trace export is currently unstable". The group is kept so the
  # gate is exercised and its removal is what unblocks real coverage here.
  - name: Unified profiler contract
    command: >-
      python -m pytest tests/integration/test_profiler_contract.py
      -v -m profiler --tb=short

  # Measured on the eight-device C550 host on 2026-09-15: 25 passed, 21 skipped,
  # 1 failed -- test_torch_backends_entry_point_is_registered, which asserts an
  # installed torch.backends entry point and cannot hold in this build-tree run
  # (the same image gap set_env_musa.sh documents).
  - name: Run torch.compile tests
    command: python -m pytest tests/integration/test_compile.py -v --tb=short
