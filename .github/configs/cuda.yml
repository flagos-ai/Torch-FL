display_name: CUDA

# Platform-specific preparation is implemented outside the common workflows.
setup_script: .github/scripts/set_env_cuda.sh

# Carries CUDA PyTorch, the FlagGems C++ operators, and an Ubuntu 24.04 userland
# recent enough for the FlagTree wheels the job installs (they bind GLIBC_2.38).
# Both CUDA entry points use it: the integration pipeline pins the same digest in
# integration-test-cuda.yml, and the manual Build Wheel path reaches it through
# the shared, vendor-agnostic workflows, which also need Python and git in the
# image. set_env_cuda.sh checks the image glibc before installing FlagTree, so a
# future rebuild on an older userland fails naming the requirement.
ci_image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl@sha256:eea3302ee25e0e3390aef4aa1a603dfe03aa93ab043f1571cb86f7a2a3026e02

runner_labels:
  - torch-fl-nv

container_volumes:
  - /data/models/Qwen/Qwen3-0.6B:/models/Qwen3-0.6B:ro

integration_environment:
  MODEL_PATH: /models/Qwen3-0.6B

container_options: >-
  --gpus all
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
wheel_artifact_name: wheel-cuda
# Keep CUDA integration self-contained; transferring the ~475MB wheel through
# the Actions artifact service can exceed the self-hosted runner job timeout.
integration_wheel_source: local-build

# The common workflow only executes this platform-provided test manifest.
integration_tests:
  - name: Check model availability
    command: test -d "$MODEL_PATH"
  - name: Check device availability
    command: |
      python - <<'PY'
      from pathlib import Path

      import torch_fl
      import torch

      torch_path = Path(torch.__file__).resolve()
      package_lib = Path(torch_fl.__file__).resolve().parent / "lib"

      assert torch.__version__.startswith("2.10.0+cpu"), torch.__version__
      assert torch.version.cuda is None, torch.version.cuda
      assert "/opt/conda/" not in str(torch_path), torch_path
      assert (package_lib / "libtorch_cuda.so").is_file(), package_lib
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      print(f"CPU PyTorch: {torch.__version__}")
      print(f"torch path: {torch_path}")
      print(f"CUDA assets: {package_lib}")
      print(f"flagos devices: {torch_fl.flagos.device_count()}")
      PY
  - name: Check FlagTree and FlagGems
    command: |
      python - <<'PY'
      import importlib.metadata
      import os
      from pathlib import Path

      import torch_fl
      import flag_gems
      import triton
      from torch_fl.compile.flagtree_shim import is_flagtree_active

      # The FlagTree wheel is source-free: it ships its own Triton, and the
      # expected version comes from the setup script so the two stay in step.
      expected = os.environ.get("FLAGTREE_VERSION", "0.6.2a2")
      distribution = importlib.metadata.distribution("flagtree")
      assert distribution.version == expected, distribution.version
      assert is_flagtree_active(), triton.__file__

      triton_root = Path(triton.__file__).resolve().parent
      assert Path(distribution.locate_file("triton")).resolve() == triton_root, triton_root
      assert triton.__version__.startswith("3.6."), triton.__version__
      print(f"FlagTree: {expected}")
      print(f"Triton: {triton.__version__} ({triton_root})")
      print(f"FlagGems: {getattr(flag_gems, '__version__', 'unknown')} ({flag_gems.__file__})")
      print(f"torch_fl: {torch_fl.__file__}")
      PY
  # Issue #391: the multi-device contract files sit at the top level of
  # tests/integration/, where no manifest sweeps by default -- a file added there
  # reached no CI job at all. Selected by marker rather than by filename so the
  # same step works on every platform and the 2+-device guard stays in the test.
  - name: Multi-device contracts
    command: >-
      python -m pytest tests/integration/
      -m "multi_device" -v -s --tb=short
  # Issue #409: two top-level contract files that no other step selects -- the
  # step above filters the whole directory on `multi_device`, which neither
  # carries, and every other sweep is scoped to ops/. Both are portable:
  # clone()/copy_ honouring the memory format, and the current device a boxing
  # op has to put back, asserted on flagos tensors alone. Named explicitly, the
  # same shape test_factory_ops.py is wired with.
  - name: Run portable dispatch contracts
    command: >-
      python -m pytest tests/integration/test_clone_dispatch_case.py
      tests/integration/test_nonzero_device_dtype_cast.py
      -v -s --tb=short
  # Issue #409: the files whose only mark is `cuda` are selected by no other
  # step -- both sweeps below require `main_ops`, and these files assert CUDA's
  # own routing rather than a member of the smoke subset. Same shape as the
  # `-m "ascend"` step in ascend.yml, plus `and not main_ops`: unlike every
  # other platform, 13 cases here carry both marks and would run twice in this
  # one job. Measured: `cuda and main_ops` selects 13 cases across 13 files and
  # none of them is FlagGems-marked, so the vendor sweep below already measures
  # every one; `dcu`/`gcu`/`ascend`/`metax`/`ppu` have no such overlap and keep
  # the plain form. `cuda` is also the platform an unidentifiable wheel
  # defaults to, so this step is where the platform's exclusive cases run.
  - name: Run CUDA-only operator tests
    command: >-
      python -m pytest tests/integration/ops/
      -m "cuda and not main_ops" -v -s --tb=short
  # `and not flaggems` keeps the vendor/FlagGems group split: flaggems-marked
  # cases are measured by the group below, not here (no switch exists any more
  # to skip them -- see ops/conftest.py).
  - name: Run operator tests (vendor backend, main ops)
    command: >-
      python -m pytest tests/integration/ops/
      -m "main_ops and not flaggems and not flaggems_python and not flaggems_cpp"
      -v -s --tb=short
  - name: Run operator tests (FlagGems runtime path, main ops)
    command: >-
      python -m pytest tests/integration/ops/
      -m "flaggems and main_ops" -v -s --tb=short
  # `and not flaggems` here for the same reason: the multinomial case is
  # measured in the FlagGems group above, where it belongs.
  - name: Run unified RNG tests
    command: >-
      python -m pytest tests/integration/ops/test_rng_dispatch.py
      -m "main_ops and not flaggems" -v -s --tb=short
  - name: Run general tests
    command: python -m pytest tests/integration/test_factory_ops.py -v -s --tb=short
  # Issue #409: the broad top-level operator smoke suite, which no other step
  # runs. It was excluded because 2 of its 58 cases failed on a 910 at
  # rtol/atol=1e-4 on a float32 mm -- tighter than a vendor cube unit's own
  # accumulation, since Ascend calls aclnnMm with cube_math_type=1
  # (ALLOW_FP32_DOWN_PRECISION). Both mm assertions now use the 1e-3 that
  # ops/test_mm_dispatch.py::test_mm_matches_cuda_ref already uses for the same
  # shape and comparison. Named explicitly, like test_factory_ops.py above.
  - name: Run general operator contract tests
    command: >-
      python -m pytest tests/integration/test_ops.py
      -v -s --tb=short
  - name: Unified AMP contract
    command: >-
      python -m pytest tests/integration/test_amp_contract.py
      -v -m amp --tb=short
  - name: Unified math-bits contract
    command: >-
      python -m pytest tests/integration/test_math_bits_contract.py
      -v -m math_bits --tb=short
  - name: Unified profiler contract
    command: >-
      python -m pytest tests/integration/test_profiler_contract.py
      -v -m profiler --tb=short

  # Structural comparison against tests/data/profiler_cuda_baseline.json, which
  # the shared contract does not cover: it asserts the public API surface, while
  # this checks tracer output against stock torch+cuda. Carried over from the
  # inline step this manifest replaces.
  - name: Profiler parity test
    command: >-
      python -m pytest tests/integration/test_profiler_parity.py
      -v -m main_ops --tb=short

  - name: Run inference tests
    command: >-
      python -m pytest tests/integration/test_qwen3_infer.py
      --model "$MODEL_PATH" -v -s --tb=short
  - name: Run torch.compile tests with FlagTree
    command: >-
      FLAGOS_USE_FLAGTREE=1
      python -m pytest tests/integration/test_compile.py
      -v -s --tb=short
  - name: Run training tests
    command: >-
      python -m pytest tests/integration/test_qwen3_train.py
      --model "$MODEL_PATH" -v -s --tb=short

  # Issue #409: two checkpoint-dependent trace/profiler files that no other step
  # selects. Unlike the portable contract files above, these cannot be named on
  # a platform without a model mount at all -- hence $MODEL_PATH rather than a
  # marker, the same shape the two steps above use.
  #
  # Measured on the eight-device C550 host on 2026-09-24 against the same Qwen3
  # checkpoint: 3 passed in 20.55s, repeated 25.20s. CUDA was not measured --
  # see the evidence note in the PR.
  #
  # test_profiler_qwen3_infer.py enforces real kernel names with non-zero
  # durations in the chrome trace. test_fallback_trace.py asserts only that
  # generation produced tokens; its value is the per-op CPU-fallback report it
  # prints, not a bound on how many ops reach fallback.
  #
  # tests/integration/test_fallback_trace_train.py is deliberately NOT here: its
  # fp32 step makes the LM-head log-softmax backward part of the graph, and that
  # kernel is intermittently nan on MetaX. It stays in the unit test's
  # _KNOWN_UNREACHABLE table with that reason recorded (issue #409).
  - name: Run model trace and profiler tests
    command: >-
      python -m pytest tests/integration/test_fallback_trace.py
      tests/integration/test_profiler_qwen3_infer.py
      --model "$MODEL_PATH" -v -s --tb=short
