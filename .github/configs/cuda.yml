display_name: CUDA

# Platform-specific preparation is implemented outside the common workflows.
setup_script: .github/scripts/set_env_cuda.sh

ci_image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl@sha256:8f6aec7fbd4b56c8d925169029462a09a0a58758fde0576b1509b2eed7627e25

runner_labels:
  - torch-fl-nv

container_volumes:
  - /data/models/Qwen/Qwen3-0.6B:/models/Qwen3-0.6B:ro

integration_environment:
  MODEL_PATH: /models/Qwen3-0.6B

container_options: >-
  --gpus all
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
wheel_artifact_name: wheel-cuda

# The wheel is built against a stock CPU PyTorch and carries the CUDA kernels in
# its own libtorch_cuda.so, so torch.version.cuda stays None: the CUDA runtime
# reaches the process through the bundled assets, not through a CUDA-variant
# Torch. The install step uses --no-deps, and this contract is what proves the
# wheel did not pull a +cu build from the default index.
torch_contract:
  base_version: "2.10.0"
  local_version: cpu
  cuda: none
  forbidden_torch_paths:
    - /opt/conda/

# The common workflow only executes this platform-provided test manifest. Every
# entry declares id, phase and failure_policy; the ten baseline ids are the
# cross-platform contract enforced by validate_integration_manifests.py.
integration_tests:
  - id: model-availability
    name: Check model availability
    phase: preflight
    failure_policy: fail-fast
    command: |
      test -f "$MODEL_PATH/config.json" || { echo "::error::Missing config.json"; exit 1; }
      test -f "$MODEL_PATH/tokenizer_config.json" || { echo "::error::Missing tokenizer_config.json"; exit 1; }
      ls "$MODEL_PATH"/*.safetensors >/dev/null 2>&1 || ls "$MODEL_PATH"/*.bin >/dev/null 2>&1 || { echo "::error::Missing weight files"; exit 1; }

  - id: device-availability
    name: Check device availability
    phase: preflight
    failure_policy: fail-fast
    command: |
      python - <<'PY'
      from pathlib import Path

      import torch_fl
      import torch

      torch_path = Path(torch.__file__).resolve()
      package_lib = Path(torch_fl.__file__).resolve().parent / "lib"

      assert torch.version.cuda is None, torch.version.cuda
      assert "/opt/conda/" not in str(torch_path), torch_path
      assert (package_lib / "libtorch_cuda.so").is_file(), package_lib
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      assert torch_fl.flagos.device_count() > 0, torch_fl.flagos.device_count()
      print(f"CPU PyTorch: {torch.__version__}")
      print(f"torch path: {torch_path}")
      print(f"CUDA assets: {package_lib}")
      print(f"flagos devices: {torch_fl.flagos.device_count()}")
      PY

  - id: operator-tests
    name: Run operator tests (vendor backend, main ops)
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/ops/
      -m "main_ops and not flaggems_python and not flaggems_cpp and not ascend and not musa and not metax and not gcu and not dcu and not ppu"
      --tb=short

  - id: rng-tests
    name: Run unified RNG tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/ops/test_rng_dispatch.py
      -m "main_ops" --tb=short

  - id: general-tests
    name: Run general tests
    phase: functional
    failure_policy: continue-after-failure
    command: python -m pytest tests/integration/test_factory_ops.py --tb=short

  - id: amp-contract
    name: Unified AMP contract
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_amp_contract.py
      -m amp --tb=short

  - id: profiler-contract
    name: Unified profiler contract
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_profiler_contract.py
      -m profiler --tb=short

  - id: compile-tests
    name: Run torch.compile tests
    phase: functional
    failure_policy: continue-after-failure
    command: python -m pytest tests/integration/test_compile.py --tb=short

  - id: inference-tests
    name: Run inference tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_qwen3_infer.py
      --model "$MODEL_PATH" --tb=short

  - id: training-tests
    name: Run training tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_qwen3_train.py
      --model "$MODEL_PATH" --tb=short

  # Platform-specific groups, additive to the baseline above. They do not stand
  # in for any baseline id.
  - id: operator-tests-flaggems
    name: Run operator tests (FlagGems runtime path, main ops)
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      FLAGOS_USE_FLAGGEMS=1
      python -m pytest tests/integration/ops/
      -m "flaggems and main_ops" --tb=short

  # Structural comparison against tests/data/profiler_cuda_baseline.json, which
  # the shared contract does not cover: it asserts the public API surface, while
  # this checks tracer output against stock torch+cuda.
  - id: profiler-parity
    name: Profiler parity test
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_profiler_parity.py
      -m main_ops --tb=short
