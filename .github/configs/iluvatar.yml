# CI lane for the CoreX 4.5.0 BI-V150 host.
# Initial PR runs retain known runtime failures; see the bring-up guide.
display_name: Iluvatar
setup_script: .github/scripts/set_env.sh
setup_platform: iluvatar
setup_stage: integration

# Official COREX 4.5.0 runtime 2.3.0, inspected 2026-11-10. The hook creates
# an independent CPU-Torch venv; the image's vendor Torch remains outside it.
ci_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-iluvatar-corex4.5.0:2.3.0@sha256:41e27e638326bfe97adc45e35dcb8cfacd27487a15d3ce395f005be84f62e08d
runner_labels:
  - ts-v150-cicd-pytorch

paths_watch:
  - torch_fl/accelerator/iluvatar/
  - torch_fl/configs/backends_iluvatar.conf
  - csrc/aten/backends/iluvatar/
  - csrc/runtime/accelerator/iluvatar/
  - csrc/runtime/allocator/backends/iluvatar_memory.h
  - scripts/codegen/codegen_iluvatar.py
  - scripts/codegen/codegen_iluvatar_flaggems.py
  - .github/scripts/hooks/set_env_iluvatar.sh
  - .github/scripts/set_env_iluvatar.sh
  - .github/requirements-iluvatar.txt

container_volumes:
  - /usr/local/corex-4.5.0/lib64/libcuda.so.1:/usr/local/corex/lib/libcuda.so.1:ro
  - /usr/local/corex-4.5.0/lib64/libixml.so:/usr/local/corex/lib/libixml.so:ro
  # Keep the user-space driver and its clock-query tool matched to the host.
  - /usr/local/corex-4.5.0/bin/ixsmi:/usr/local/corex/bin/ixsmi:ro

# Use every device exposed to this runner; no physical-card reservation is
# imposed by CI. Keep the SDK's backend-autoload setting for the CPU core.
integration_environment:
  TORCH_DEVICE_BACKEND_AUTOLOAD: "0"

# Privileged access includes the compute nodes and /dev/itrctl required by
# cuInit. Keep runc and the validated CoreX driver/tool mounts above.
container_options: >-
  --runtime=runc
  --privileged
  --shm-size=16g
  --ulimit=memlock=-1

timeout_minutes: 60
wheel_artifact_name: wheel-iluvatar

environment_check:
  torch_first: true
  torch_cxx11_abi: true
  loaded_torch_libraries:
    - libc10.so
    - libtorch_cpu.so
    - libtorch_python.so
  forbidden_loaded_library_prefixes:
    - libtorch_cuda
    - libc10_cuda
  elf_dependencies:
    files:
      - lib/libtorch_fl.so
      - lib/libtorch_bindings.so
    forbidden:
      - libtorch_cuda
      - libc10_cuda
  triton_target:
    backend: corex
    arch: 71
    warp_size: 64
    device_capability: [7, 1]
  venv_isolation: true
  torch_version_exact: "2.10.0+cpu"
  torch_distribution_version: "2.10.0+cpu"
  cuda_version: null
  torch_path_forbidden:
    - /flagos/
    - /usr/local/lib/
  require_build_kernels:
    - vendor
    - flaggems
  forbid_build_kernels:
    - boxing
    - flaggems_cpp
    - tileops
  require_package_files:
    - lib/libtorch_fl.so
    - lib/libtorch_bindings.so
  forbid_package_files:
    - lib_iluvatar
    - lib/libtorch_cuda.so
    - lib/libc10_cuda.so
  cuda_available: true
  cuda_devices:
    at_least: 2
  flagos_devices:
    at_least: 2
  triton_backend: iluvatar
  flaggems_vendor: iluvatar
  # The wheel's metadata has to carry the autoload hook; a wheel built without
  # it does not activate on `import torch` (setuptools drops a setup()-side
  # entry-points table), and this step is the first place that imports the
  # installed wheel.
  require_torch_backends_hook: true
  flagtree:
    version_env: FLAGTREE_VERSION
    version_default: 0.7.1a1+iluvatar3.6
    triton_prefix: "3.6."
