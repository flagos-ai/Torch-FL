display_name: Kunlun P800 XPU

# Kunlunxin-specific environment preparation stays outside the common workflow.
setup_script: .github/scripts/set_env.sh
setup_platform: kunlunxin

# Kunlunxin's hook prebuilds the native library in place and probes the device
# only when it is invoked as `build`; called as `integration` it skips both, and
# the wheel build then finds no library to link. Every other platform provisions
# at `integration`, so this is the one stage that is not the default.
setup_stage: build

# Official XRE 5.37.1 runtime. Prepare an independent Python 3.10 / CPU Torch
# venv, selectively copying compatible Python packages from the runtime.
ci_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-kunlunxin-xre5.37.1:2.3.0@sha256:cc0deb9c09cd49977e754892e85f4414835d142379949cc2d66261f63b47959d

runner_labels:
  - p800-8g-cicd-pytorch

# Platform-specific code selects this hardware lane on PRs.
# Shared or unrecognized code selects every lane conservatively.
paths_watch:
  - torch_fl/accelerator/kunlunxin/
  - torch_fl/configs/backends_kunlunxin.conf
  - csrc/aten/backends/kunlunxin/
  - csrc/runtime/accelerator/kunlunxin/
  - csrc/runtime/allocator/backends/kunlunxin_memory.h
  - .github/scripts/hooks/set_env_kunlunxin.sh
  - .github/scripts/set_env_kunlunxin.sh
  - scripts/codegen/codegen_kunlunxin.py

container_volumes: []

integration_environment: {}

# Build and test tools are prepared once by the platform hook.
integration_build_tools: []
integration_test_dependencies: []

container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
# Release/manual wheel-build artifact; CI tests the wheel in the build job.
wheel_artifact_name: wheel-kunlunxin

# What this platform's environment has to look like before any test runs, read
# by the first step of .github/integration-manifest.yml through
# .github/scripts/check_platform_environment.py. The vocabulary is documented on
# that script; the values are this platform's, and they assert the same things
# the hand-written heredoc that used to sit here did.
#
# The FlagGems stack has to be the flagtree build, not a stock triton wheel left
# behind by the image: only flagtree carries the xpu backend the XPU kernels are
# compiled for. One P800 is enough for the suites that run here.
environment_check:
  torch_version_base: "2.10.0"
  cuda_version: null
  torch_path_forbidden:
    - /usr/local/lib/python3.10/dist-packages
  flagos_devices:
    at_least: 1
  triton_backend: xpu
